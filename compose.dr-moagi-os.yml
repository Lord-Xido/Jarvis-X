services:
  dr-moagi-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvisx:local
    init: true
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      JARVISX_STATE_DIR: /var/lib/jarvisx
      JARVISX_OS_SIDE: "64"
      JARVISX_OS_MAX_ACTIVE_CELLS: "50000"
      JARVISX_OS_THRESHOLD: "0.5"
      JARVISX_OS_CONTRACTION: "0.08"
      JARVISX_OS_ATTENUATION: "0.10"
      JARVISX_OS_BLOCK_SIZE: "2"
      JARVISX_OS_QUANTIZATION: "0.01"
      JARVISX_OS_FIXED_POINT_PASSES: "1"
      JARVISX_OS_AUTORUN_INTERVAL: "0.5"
    volumes:
      - dr-moagi-os-state:/var/lib/jarvisx
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=2).read()
      interval: 20s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  dr-moagi-os-state:
