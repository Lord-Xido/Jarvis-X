<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03111d"/>
      <stop offset="0.55" stop-color="#08192a"/>
      <stop offset="1" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91f7ff"/>
      <stop offset="1" stop-color="#4fa2ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a8ff"/>
      <stop offset="1" stop-color="#7767ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ffb4"/>
      <stop offset="1" stop-color="#50d89e"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset="0.22" stop-color="#78f3ef"/>
      <stop offset="0.55" stop-color="#238caa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#193252" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#8cecff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#6ff0a8"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#ff7a7a"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;fill:#eaf7ff;font-size:16px;font-weight:700}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#a9c7d8;font-size:12px}
      .tiny{font-family:Arial,Helvetica,sans-serif;fill:#7fa9bf;font-size:10px}
      .stage{fill:#071a2a;stroke:#6de6ff;stroke-width:1.6}
      .stage2{fill:#0e1530;stroke:#a995ff;stroke-width:1.6}
      .stage3{fill:#0b211d;stroke:#6be0a0;stroke-width:1.6}
      .flow{fill:none;stroke:#82e8ff;stroke-width:2;marker-end:url(#arrow);opacity:.9}
      .wire{fill:none;stroke:#8aeaff;stroke-width:1.1;opacity:.55}
      .grid{stroke:#5a7890;stroke-width:.7;opacity:.16}
    </style>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>

  <!-- logical cube -->
  <g opacity="0.95">
    <polygon points="170,105 1130,55 1250,145 285,200" fill="#0c2032" fill-opacity=".22" stroke="#8feaff" stroke-width="2"/>
    <polygon points="285,200 1250,145 1242,650 280,710" fill="#06131f" fill-opacity=".32" stroke="#9bb8ff" stroke-width="2"/>
    <polygon points="170,105 285,200 280,710 165,615" fill="#081926" fill-opacity=".38" stroke="#7ae3ff" stroke-width="2"/>
    <line x1="170" y1="105" x2="165" y2="615" class="wire"/>
    <line x1="1130" y1="55" x2="1125" y2="555" class="wire"/>
    <line x1="1130" y1="55" x2="1250" y2="145" class="wire"/>
    <line x1="1125" y1="555" x2="1242" y2="650" class="wire"/>
    <text x="1115" y="38" class="small">[0,10⁹)</text>
    <text x="1260" y="145" class="small">[0,10⁹)</text>
    <text x="1160" y="675" class="small">[0,10⁹)</text>
  </g>

  <!-- grid hints -->
  <g>
    <line x1="360" y1="195" x2="355" y2="705" class="grid"/>
    <line x1="520" y1="185" x2="515" y2="695" class="grid"/>
    <line x1="680" y1="175" x2="675" y2="685" class="grid"/>
    <line x1="840" y1="165" x2="835" y2="675" class="grid"/>
    <line x1="1000" y1="155" x2="995" y2="665" class="grid"/>
    <line x1="280" y1="300" x2="1248" y2="245" class="grid"/>
    <line x1="280" y1="420" x2="1246" y2="365" class="grid"/>
    <line x1="280" y1="540" x2="1244" y2="485" class="grid"/>
  </g>

  <!-- input modalities -->
  <g>
    <text x="30" y="100" class="label">TEXT</text>
    <rect x="80" y="73" width="92" height="42" rx="6" class="stage"/>
    <text x="88" y="91" class="tiny">UTF-8 / TOKENS</text>
    <text x="88" y="106" class="tiny">01011010…</text>

    <text x="30" y="165" class="label">IMAGE</text>
    <rect x="80" y="135" width="92" height="50" rx="6" class="stage2"/>
    <circle cx="104" cy="157" r="10" fill="#ffcf70"/><rect x="120" y="146" width="37" height="24" fill="#4b86c7"/>

    <text x="30" y="230" class="label">AUDIO</text>
    <rect x="80" y="202" width="92" height="48" rx="6" class="stage"/>
    <path d="M85 227 L92 213 L98 241 L105 218 L112 233 L120 206 L129 244 L137 219 L144 233 L151 211 L164 226" fill="none" stroke="#75edff" stroke-width="2"/>

    <text x="30" y="295" class="label">VIDEO</text>
    <rect x="80" y="267" width="92" height="48" rx="6" class="stage2"/>
    <rect x="89" y="276" width="30" height="28" fill="#325675"/><polygon points="98,282 98,299 112,290" fill="#d8efff"/>
    <rect x="127" y="276" width="30" height="28" fill="#503a74"/>

    <text x="30" y="360" class="label">BYTES</text>
    <rect x="80" y="332" width="92" height="48" rx="6" class="stage"/>
    <text x="87" y="350" class="tiny">0101010011</text><text x="87" y="364" class="tiny">1011100101</text>
  </g>

  <!-- canonicalization -->
  <g>
    <rect x="205" y="215" width="145" height="92" rx="12" class="stage"/>
    <text x="224" y="245" class="label">BYTE</text>
    <text x="215" y="267" class="label">CANONICALIZATION</text>
    <text x="221" y="289" class="small">&amp; METADATA WRAPPER</text>
    <path d="M172 95 C205 130 220 175 245 215" class="flow"/>
    <path d="M172 160 C205 175 220 194 250 218" class="flow"/>
    <path d="M172 225 C205 225 220 226 250 229" class="flow"/>
    <path d="M172 290 C205 275 222 260 250 247" class="flow"/>
    <path d="M172 355 C205 320 225 285 250 264" class="flow"/>
  </g>

  <!-- active tiles -->
  <g filter="url(#glow)">
    <text x="345" y="105" class="label">MAX 64 ACTIVE TILES</text>
    <g transform="translate(365 135)">
      <rect width="68" height="68" rx="8" fill="#0e2934" stroke="#80efff"/><path d="M8 50 L60 18 M12 15 L58 54" class="wire"/>
      <text x="8" y="84" class="small">TEXT TILE</text>
    </g>
    <g transform="translate(455 108)">
      <rect width="68" height="68" rx="8" fill="#2a2419" stroke="#ffd66d"/><path d="M8 50 L60 18 M12 15 L58 54" class="wire"/>
      <text x="7" y="84" class="small">IMAGE TILE</text>
    </g>
    <g transform="translate(555 88)">
      <rect width="68" height="68" rx="8" fill="#152634" stroke="#8cecff"/><path d="M8 50 L60 18 M12 15 L58 54" class="wire"/>
      <text x="7" y="84" class="small">AUDIO TILE</text>
    </g>
    <g transform="translate(650 128)">
      <rect width="68" height="68" rx="8" fill="#211934" stroke="#bb91ff"/><path d="M8 50 L60 18 M12 15 L58 54" class="wire"/>
      <text x="7" y="84" class="small">VIDEO TILE</text>
    </g>
    <path d="M350 260 C370 220 385 205 400 200" class="flow"/>
  </g>

  <!-- encoder stack -->
  <g>
    <text x="385" y="345" class="label">TILE ENCODER Eθ</text>
    <rect x="390" y="360" width="36" height="135" class="stage" opacity=".85"/>
    <rect x="432" y="370" width="36" height="125" class="stage2" opacity=".85"/>
    <rect x="474" y="382" width="36" height="113" class="stage" opacity=".85"/>
    <rect x="516" y="395" width="36" height="100" class="stage2" opacity=".85"/>
    <path d="M345 265 C370 310 382 330 402 360" class="flow"/>
  </g>

  <!-- modality embeddings / fusion -->
  <g>
    <text x="555" y="336" class="label">MODALITY EMBEDDINGS</text>
    <g fill="#8cecff" opacity=".9">
      <circle cx="580" cy="380" r="7"/><circle cx="618" cy="362" r="7"/><circle cx="646" cy="396" r="7"/>
      <circle cx="602" cy="420" r="7"/><circle cx="655" cy="440" r="7"/><circle cx="690" cy="378" r="7"/>
    </g>
    <g stroke="#7fd6ff" opacity=".45">
      <line x1="580" y1="380" x2="646" y2="396"/><line x1="618" y1="362" x2="602" y2="420"/>
      <line x1="646" y1="396" x2="690" y2="378"/><line x1="602" y1="420" x2="655" y2="440"/>
      <line x1="618" y1="362" x2="690" y2="378"/><line x1="580" y1="380" x2="655" y2="440"/>
    </g>
    <text x="545" y="475" class="label">AUTO-ORCHESTRATOR</text>
    <text x="560" y="496" class="small">&amp; WEIGHTED FUSION</text>
    <path d="M552 430 C570 435 585 438 600 440" class="flow"/>
  </g>

  <!-- recurrent latent torus -->
  <g filter="url(#glow)">
    <text x="710" y="240" class="label">SELF-REFERENTIAL</text>
    <text x="715" y="262" class="label">INWARD RECURRENCE Φin</text>
    <ellipse cx="805" cy="390" rx="125" ry="98" fill="none" stroke="#8be9ff" stroke-width="2" opacity=".75"/>
    <ellipse cx="805" cy="390" rx="92" ry="55" fill="none" stroke="#a98eff" stroke-width="1.6" opacity=".65"/>
    <ellipse cx="805" cy="390" rx="52" ry="28" fill="none" stroke="#7cf3d0" stroke-width="1.4" opacity=".7"/>
    <circle cx="805" cy="390" r="56" fill="url(#core)"/>
    <circle cx="805" cy="390" r="11" fill="#dcffff"/>
    <path d="M685 390 C720 330 762 304 813 306 C880 309 935 350 935 405 C935 457 885 495 812 494 C745 493 695 455 686 410" fill="none" stroke="#9ef7ff" stroke-width="1.1" stroke-dasharray="4 6" marker-end="url(#arrow)"/>
    <text x="780" y="520" class="label">Z*</text>
    <path d="M690 445 C715 450 730 446 744 435" class="flow"/>
  </g>

  <!-- decoder -->
  <g>
    <text x="970" y="300" class="label">CONTEXT INJECTION</text>
    <text x="980" y="320" class="small">BACK INTO EACH TILE</text>
    <path d="M930 392 C958 378 975 365 990 350" class="flow"/>
    <text x="995" y="370" class="label">TILE DECODER Dφ</text>
    <rect x="1000" y="390" width="36" height="125" class="stage2" opacity=".85"/>
    <rect x="1042" y="378" width="36" height="137" class="stage" opacity=".85"/>
    <rect x="1084" y="365" width="36" height="150" class="stage3" opacity=".85"/>
    <path d="M930 408 C960 420 978 426 1000 432" class="flow"/>
  </g>

  <!-- outputs -->
  <g>
    <text x="1175" y="350" class="label">TEXT</text>
    <text x="1175" y="405" class="label">IMAGE</text>
    <text x="1175" y="460" class="label">AUDIO</text>
    <text x="1175" y="515" class="label">VIDEO</text>
    <text x="1175" y="570" class="label">BYTES</text>
    <path d="M1120 405 C1145 385 1152 370 1165 355" class="flow"/>
    <path d="M1120 430 C1145 420 1152 412 1165 405" class="flow"/>
    <path d="M1120 450 C1145 455 1152 457 1165 460" class="flow"/>
    <path d="M1120 470 C1145 490 1152 500 1165 515" class="flow"/>
    <path d="M1120 492 C1145 530 1152 545 1165 570" class="flow"/>
  </g>

  <!-- CTR -->
  <g>
    <rect x="720" y="580" width="320" height="120" rx="18" fill="#071a22" stroke="#8cecff" stroke-width="1.8"/>
    <text x="748" y="615" class="label">CTR VERIFICATION &amp; COMMIT/ROLLBACK GATE</text>
    <text x="760" y="640" class="small">candidate receipt → verify → authority decision</text>
    <rect x="775" y="662" width="95" height="28" rx="6" fill="#15382b" stroke="#65efa5"/>
    <text x="796" y="681" class="small" fill="#d8ffe5">COMMIT</text>
    <rect x="895" y="662" width="105" height="28" rx="6" fill="#3a171d" stroke="#ff7777"/>
    <text x="914" y="681" class="small" fill="#ffd6d6">ROLLBACK</text>
    <path d="M805 500 C800 535 800 555 808 580" class="flow"/>
    <path d="M870 676 L895 676" fill="none" stroke="#ff7777" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M870 676 L870 676" fill="none"/>
  </g>

  <!-- memory loop -->
  <g>
    <rect x="555" y="575" width="125" height="78" rx="12" class="stage3"/>
    <text x="590" y="604" class="label">Ω</text>
    <text x="570" y="627" class="small">MEMORY</text>
    <path d="M720 635 C700 632 690 625 680 615" class="flow"/>
    <path d="M680 590 C715 548 742 520 767 480" class="flow"/>
  </g>

  <!-- footer -->
  <text x="35" y="705" class="label" style="font-size:32px">MOAGI</text>
  <text x="35" y="735" class="label" style="font-size:21px">Multimodal Sparse 3D ANN</text>
  <text x="35" y="758" class="small">10²⁷ logical coordinate system · bounded sparse residency · candidate-first authority</text>
  <text x="930" y="755" class="tiny">Reference topology: learned embeddings/ANN kernels are interface targets; virtual scale is not physical residency.</text>
</svg>