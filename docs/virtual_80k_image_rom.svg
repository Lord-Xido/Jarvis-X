<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Dr Moagi Cognitive Matrix — Virtual 80K image ROM</title>
<desc id="d">A bounded 3D codec and verification flow for a 6.4-billion-address virtual raster, represented by one active tile rather than dense allocation.</desc>
<defs>
  <linearGradient id="b" x2="0.8" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#15234b"/></linearGradient>
  <linearGradient id="c" x2="1" y2="1"><stop stop-color="#36d8fc"/><stop offset="1" stop-color="#9167ff"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59ccef"/></marker>
  <style>
    text{font-family:ui-monospace,Consolas,monospace;fill:#d6f2ff} .h{font-size:25px;font-weight:bold}
    .s{font-size:14px} .tiny{font-size:12px;fill:#9bc2db} .node{fill:#101f3c;stroke:#349acb;stroke-width:1.5}
    .edge{fill:none;stroke:#59ccef;stroke-width:2;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#b)"/>
<text x="38" y="54" class="h">DR MOAGI COGNITIVE MATRIX</text>
<text x="40" y="83" class="s">Virtual 80K × 80K Pixel ROM | 6,400,000,000 logical addresses</text>
<text x="40" y="106" class="tiny">Finite active tile, 3D latent field, verified exact recovery; not 6.4B physically resident pixels</text>
<g transform="translate(33 157)">
 <rect class="node" x="0" y="0" width="215" height="128" rx="10"/>
 <text x="14" y="29" font-size="17">VIRTUAL RASTER</text><text x="14" y="55" class="s">80,000 × 80,000</text>
 <text x="14" y="82" class="tiny">Sparse coordinate addressing</text><text x="14" y="103" class="tiny">No full allocation</text>
 <rect class="node" x="265" y="0" width="205" height="128" rx="10"/>
 <text x="280" y="29" font-size="17">FETCH_TILE</text><text x="280" y="57" class="tiny">8 × 8 × 4 × 4 channels</text><text x="280" y="79" class="tiny">1,024 active bytes</text><text x="280" y="103" class="tiny">3D bounded working set</text>
 <rect class="node" x="520" y="0" width="205" height="128" rx="10"/>
 <text x="535" y="29" font-size="17">ENCODE_3D</text><text x="535" y="56" class="tiny">2 × 2 × 2 pooling</text><text x="535" y="79" class="tiny">8:1 lossy latent</text><text x="535" y="103" class="tiny">per feature channel</text>
 <rect class="node" x="775" y="0" width="340" height="128" rx="10"/>
 <text x="793" y="28" font-size="17">COUPLE_6N → FOLD_IN</text>
 <text x="793" y="55" class="tiny">Periodic six-neighbor smoothing</text>
 <text x="793" y="78" class="tiny">Z' = (1-α)Z + α mean(N6)</text>
 <text x="793" y="103" class="tiny">Bounded 3D latent refinement</text>
 <path class="edge" d="M215 64 H261"/><path class="edge" d="M470 64 H516"/><path class="edge" d="M725 64 H771"/>
</g>
<!-- Isometric bounded 3D tensor -->
<g transform="translate(180 410)">
 <polygon points="0,0 155,-90 310,0 155,90" fill="#123761" stroke="#5bdafa" stroke-width="2"/>
 <polygon points="0,0 155,90 155,198 0,108" fill="#0d2452" stroke="#6d98f6" stroke-width="2"/>
 <polygon points="155,90 310,0 310,108 155,198" fill="#24215c" stroke="#b592ff" stroke-width="2"/>
 <g opacity=".6" stroke="#49c9fc">
  <path d="M40 -23 L195 68 M80 -46 L235 44 M120 -69 L275 21 M40 23 L195 -66 M80 46 L235 -44 M120 69 L275 -21"/>
  <path d="M0 35 L155 125 L310 35 M0 70 L155 160 L310 70" fill="none"/>
 </g>
 <circle cx="155" cy="90" r="15" fill="#ffe77d" opacity=".9"/>
 <text x="90" y="-112" class="s">3D active working tile</text>
 <text x="80" y="226" class="tiny">Z × Y × X × C numeric field</text>
</g>
<g transform="translate(545 376)">
 <rect class="node" width="275" height="102" rx="10"/><text x="17" y="30" font-size="18">DECODE_3D</text>
 <text x="17" y="57" class="tiny">Nearest-block expansion</text><text x="17" y="79" class="tiny">Generate a bounded decoded tile</text>
 <rect class="node" y="144" width="275" height="105" rx="10"/><text x="17" y="173" font-size="18">COMPARE + VERIFY</text>
 <text x="17" y="199" class="tiny">SHA-256, PNG CRC, XOR residual</text><text x="17" y="221" class="tiny">Bit-exact recovery when enabled</text>
 <path class="edge" d="M140 103 V140"/>
</g>
<g transform="translate(867 376)">
 <rect class="node" width="282" height="102" rx="10"/><text x="16" y="30" font-size="18">PNG ROM IMAGE</text>
 <text x="16" y="56" class="tiny">48×48 preview + vpRm data chunk</text>
 <text x="16" y="79" class="tiny">Explicit verified interpreter</text>
 <rect x="0" y="144" class="node" width="282" height="105" rx="10"/>
 <text x="16" y="173" font-size="18">CTR COMMIT GATE</text>
 <text x="16" y="199" class="tiny">Contrast → Reckon → Verify</text><text x="16" y="221" class="tiny">Commit / Reject corrupted ROM</text>
 <path class="edge" d="M140 103 V140"/>
</g>
<path class="edge" d="M820 427 H864"/><path class="edge" d="M820 574 H864"/>
<text x="38" y="683" class="tiny">Working → Robust → Portable → Elegant → Advanced | Reference algorithm, not learned multimodal generation</text>
</svg>
