[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dm3d-scaleout"
version = "0.1.0"
description = "Scalable DM3D multimodal reference: disk shards, DDP/FSDP2, vector segments, virtual tiling"
requires-python = ">=3.10"
dependencies = ["torch>=2.8,<3", "numpy>=1.24,<3", "scipy>=1.10", "pillow>=10", "imageio>=2.33", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dm3d_multimodal*", "dm3d_scale*"]
