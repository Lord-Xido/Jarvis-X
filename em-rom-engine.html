<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EM-ROM Cognitive Byte Circuit Engine v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        body { margin:0; overflow:hidden; background:#000; color:#0ff; font-family:monospace; }
        #ui { position:absolute; top:10px; left:10px; width:460px; background:rgba(0,15,35,0.96); padding:16px; border:2px solid #0ff; border-radius:10px; z-index:100; }
        .panel { margin:12px 0; padding:12px; background:#001424; border-left:4px solid #0ff; }
        button { background:#002244; color:#0ff; border:1px solid #0ff; padding:9px 16px; margin:4px; cursor:pointer; font-family:monospace; }
        #log { height:160px; overflow:auto; font-size:13px; color:#9ff; background:#0004; padding:8px; }
        .active { color:#0f0; animation: pulse 1.2s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="ui">
        <h2>EM-ROM Auto Encode/Decode Engine v2</h2>
        
        <div class="panel">
            <strong>Pipeline Status:</strong><br>
            <span id="phase">EM Field → Encode → ROM → Predict → Decode</span>
        </div>
        
        <div class="panel">
            <button onclick="runSingleCycle()">Run Single Cycle</button>
            <button onclick="toggleAutoMode()">Auto Mode: <span id="autoStatus">OFF</span></button>
            <button onclick="injectSignal()">Inject EM Signal</button>
            <button onclick="resetROM()">Reset ROM</button>
        </div>
        
        <div class="panel">
            <div id="stats">Agents: 256 | Cycle: 0 | Avg Error: 0.000</div>
        </div>
        
        <div class="panel" id="log">System booted. Awaiting cycles...</div>
    </div>

<script>
    let scene, camera, renderer, time = 0, cycleCount = 0, autoMode = false;
    let agents = [];
    let rom = new Uint8Array(8192); // Larger ROM
    let fieldLines = [];

    class ByteAgent {
        constructor(id) {
            this.id = id;
            this.byte = Math.floor(Math.random() * 256);
            this.memory = Math.floor(Math.random() * 256);
            this.pred = 0;
            this.error = 0;
            this.phase = Math.random() * Math.PI * 2;

            this.mesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.09, 12, 12),
                new THREE.MeshPhongMaterial({ emissive: 0x00ccff })
            );

            const angle = Math.random() * Math.PI * 2;
            const radius = 1.5 + Math.random() * 4.2;
            this.mesh.position.set(
                radius * Math.cos(angle),
                (Math.random() - 0.5) * 5.5,
                radius * Math.sin(angle)
            );
            scene.add(this.mesh);
        }

        // Core Encode → ROM → Predict → Decode
        process() {
            // Encode
            this.pred = this.byte ^ this.memory;

            // ROM Access + Write
            const addr = (this.byte * this.memory + this.id) & 8191;
            const stored = rom[addr];
            rom[addr] = (stored + this.pred + this.error) & 255;
            this.memory = rom[addr];

            // Decode + Error
            this.error = this.byte ^ this.pred;
            this.byte = (this.byte + this.pred + this.memory) & 255;
        }

        updateVisuals() {
            const intensity = this.byte / 255;
            const errorLevel = Math.min(this.error / 128, 1);

            this.mesh.scale.setScalar(0.7 + intensity * 1.8);
            this.mesh.material.emissive.setHSL(intensity * 0.7, 1.0, 0.5 + errorLevel * 0.3);
            this.mesh.position.y += Math.sin(time * 3 + this.id) * 0.008;
        }
    }

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 16);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("container").appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x336688, 1.2));

        const light1 = new THREE.PointLight(0x00ffff, 3.5, 100);
        light1.position.set(10, 12, 10);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff0088, 2.2, 100);
        light2.position.set(-10, -6, -12);
        scene.add(light2);

        // Create 256 agents
        for (let i = 0; i < 256; i++) {
            agents.push(new ByteAgent(i));
        }

        createEMField();
        log("EM-ROM Engine initialized. 256 cognitive byte agents online.");
        animate();
    }

    function createEMField() {
        for (let i = 0; i < 24; i++) {
            const points = [];
            for (let j = 0; j < 120; j++) {
                const a = j * 0.052 + i * 0.3;
                points.push(new THREE.Vector3(
                    Math.cos(a) * (4.5 + Math.sin(a*4)*0.6),
                    Math.sin(a*2.3 + i) * 1.8,
                    Math.sin(a) * (4.5 + Math.cos(a*3)*0.6)
                ));
            }
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(points),
                new THREE.LineBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.35 })
            );
            scene.add(line);
            fieldLines.push(line);
        }
    }

    function runSingleCycle() {
        agents.forEach(agent => agent.process());
        cycleCount++;

        const avgError = agents.reduce((sum, a) => sum + a.error, 0) / agents.length / 255;

        document.getElementById("stats").innerHTML = 
            `Agents: ${agents.length} | Cycle: ${cycleCount}<br>` +
            `Avg Residual Error: ${avgError.toFixed(4)}`;

        agents.forEach(a => a.updateVisuals());

        if (Math.random() < 0.3) log(`Cycle ${cycleCount} committed to ROM.`);
    }

    function toggleAutoMode() {
        autoMode = !autoMode;
        document.getElementById("autoStatus").textContent = autoMode ? "ON" : "OFF";
        document.getElementById("autoStatus").classList.toggle("active", autoMode);
        log(autoMode ? "Auto-encoding loop ENABLED." : "Auto-encoding loop DISABLED.");
    }

    function injectSignal() {
        agents.forEach((a, i) => {
            a.byte = (a.byte + Math.floor(Math.sin(i + time * 8) * 90 + 90)) & 255;
        });
        log("Strong EM signal injected into the byte lattice.");
        globalPulse();
    }

    function globalPulse() {
        agents.forEach(a => {
            a.mesh.scale.setScalar(3.2);
        });
        setTimeout(() => agents.forEach(a => a.mesh.scale.setScalar(1)), 280);
        log("Global resonant pulse transmitted through EM-ROM field.");
    }

    function resetROM() {
        rom = new Uint8Array(8192);
        log("ROM lattice reset to zero state.");
    }

    function log(msg) {
        const logEl = document.getElementById("log");
        logEl.innerHTML = `> ${msg}<br>` + logEl.innerHTML.slice(0, 800);
    }

    function animate() {
        requestAnimationFrame(animate);
        time += 0.018;

        if (autoMode) runSingleCycle();

        scene.rotation.y += 0.0018;

        fieldLines.forEach((line, i) => {
            line.rotation.y = time * 0.1 + i * 0.02;
        });

        renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>

</body>
</html>
