apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvisx-hypercloud-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvisx-hypercloud
spec:
  # SQLite/WAL is the operational single-pod reference state backend. Multiple
  # worker sidecars share this one transactional volume. Replace the state
  # adapter before increasing pod replicas across nodes.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jarvisx-hypercloud
  template:
    metadata:
      labels:
        app: jarvisx-hypercloud
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/lord-xido/jarvis-x:hypercloud
          imagePullPolicy: IfNotPresent
          env:
            - name: JARVISX_STATE_DB
              value: /var/lib/jarvisx/state.db
            - name: JARVISX_OBJECT_ROOT
              value: /var/lib/jarvisx/objects
            - name: JARVISX_LATTICE_SHAPE
              value: "16,16,16"
            - name: JARVISX_WORKER_TTL_SECONDS
              value: "30"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: state
              mountPath: /var/lib/jarvisx

        - name: worker-a
          image: ghcr.io/lord-xido/jarvis-x:hypercloud
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "jarvisx.cloud.worker"]
          env:
            - name: JARVISX_STATE_DB
              value: /var/lib/jarvisx/state.db
            - name: JARVISX_OBJECT_ROOT
              value: /var/lib/jarvisx/objects
            - name: JARVISX_LATTICE_SHAPE
              value: "16,16,16"
            - name: JARVISX_WORKER_ID
              value: hypercloud-worker-a
            - name: JARVISX_WORKER_COORD
              value: "4,4,4"
            - name: JARVISX_WORKER_CAPABILITIES
              value: "chat,codec"
            - name: JARVISX_JOB_LEASE_SECONDS
              value: "300"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: state
              mountPath: /var/lib/jarvisx

        - name: worker-b
          image: ghcr.io/lord-xido/jarvis-x:hypercloud
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "jarvisx.cloud.worker"]
          env:
            - name: JARVISX_STATE_DB
              value: /var/lib/jarvisx/state.db
            - name: JARVISX_OBJECT_ROOT
              value: /var/lib/jarvisx/objects
            - name: JARVISX_LATTICE_SHAPE
              value: "16,16,16"
            - name: JARVISX_WORKER_ID
              value: hypercloud-worker-b
            - name: JARVISX_WORKER_COORD
              value: "12,12,12"
            - name: JARVISX_WORKER_CAPABILITIES
              value: "chat,codec"
            - name: JARVISX_JOB_LEASE_SECONDS
              value: "300"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: state
              mountPath: /var/lib/jarvisx
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: jarvisx-hypercloud-state
---
apiVersion: v1
kind: Service
metadata:
  name: jarvisx-hypercloud
spec:
  selector:
    app: jarvisx-hypercloud
  ports:
    - name: http
      port: 80
      targetPort: 8080
