[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvisx"
version = "0.1.0"
description = "Deterministic, auditable bytecode virtual machine and sparse-computing research platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matladi Maxwell Moagi"}]
keywords = [
    "virtual-machine",
    "bytecode",
    "deterministic-computing",
    "sparse-computing",
    "autoencoding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "uvicorn>=0.23.0",
    "fastapi>=0.100.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.0",
    "build>=1.2",
    "flake8>=7.0",
    "isort>=5.13",
    "mypy>=1.10",
    "numpy>=1.24",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "twine>=6.0",
    "z3-solver>=4.13.0",
]
test = [
    "numpy>=1.24",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "z3-solver>=4.13.0",
]
torch = [
    "torch>=2.4",
]
graphics = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Lord-Xido/Jarvis-X"
Documentation = "https://github.com/Lord-Xido/Jarvis-X/tree/main/docs"
Repository = "https://github.com/Lord-Xido/Jarvis-X.git"
Issues = "https://github.com/Lord-Xido/Jarvis-X/issues"
Changelog = "https://github.com/Lord-Xido/Jarvis-X/blob/main/CHANGELOG.md"

[project.scripts]
jarvisx = "jarvisx.cli:main"
jarvisx-hyperion = "jarvisx.hyperion_cli:main"
jarvisx-dr-moagi = "jarvisx.dr_moagi_autoexec_cli:main"
jarvisx-dr-moagi-os = "jarvisx.dr_moagi_os_cli:main"
jarvisx-dr-moagi-system = "jarvisx.dr_moagi_system_cli:main"
jarvisx-dr-moagi-firmware = "jarvisx.dr_moagi_firmware_cli:main"
jarvisx-dr-moagi-frontier = "jarvisx.dr_moagi_frontier_cli:main"
jarvisx-bitmatrix3d = "jarvisx.bitmatrix3d_cli:main"
jarvisx-deep-distiller = "jarvisx.dr_moagi_deep_distiller_cli:main"
jarvisx-dr-moagi-3d-animation = "jarvisx.dr_moagi_3d_animation_codec:main"
jarvisx-dr-moagi-codegen = "jarvisx.dr_moagi_codegen_engine:main"
jarvisx-dr-moagi-resonator = "jarvisx.dr_moagi_monadic_resonator:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvisx = ["_reference/dr_moagi_3d_animation_autoencoder/*.part"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-config --strict-markers --cov=jarvisx --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=60 --tb=short"

[tool.coverage.run]
source = ["jarvisx"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\\.pyi?$'
extend-exclude = '''
/(
    \\.git
  | \\.mypy_cache
  | \\.pytest_cache
  | \\.venv
  | build
  | dist
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = false
warn_unused_ignores = true
allow_redefinition = true
no_implicit_optional = true
ignore_missing_imports = true