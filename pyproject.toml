[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvisx"
version = "0.6.0"
description = "Jarvis-X neural runtimes, enterprise OS, SE(3) motion, and CHRYSALIS-Theta sparse 3D arithmetic"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Lord-Xido"}]
keywords = ["assembly", "virtual-machine", "ann", "30d", "saas", "billing", "multi-tenant", "digital-twin", "event-sourcing", "workflow", "autonomic", "motion", "se3", "chrysalis", "moe", "multimodal", "3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "uvicorn>=0.23.0",
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9,<3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Lord-Xido/Jarvis-X"
Repository = "https://github.com/Lord-Xido/Jarvis-X.git"
Issues = "https://github.com/Lord-Xido/Jarvis-X/issues"

[project.scripts]
jarvisx = "jarvisx.cli:main"
drmoagi-saas = "jarvisx.saas.cli:main"
drmoagi-autonomy = "jarvisx.saas.autonomy.cli:main"
drmoagi-motion = "jarvisx.motion3d_cli:main"
chrysalis-theta = "jarvisx.chrysalis3d_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/jarvisx --cov-report=term-missing --cov-report=html --tb=short"

[tool.coverage.run]
source = ["src/jarvisx"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\\.pyi?$'
extend-exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
