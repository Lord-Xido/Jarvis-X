[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vann-rom-sdk"
version = "0.3.0"
description = "Sparse 3D bytecode VM and sparse 4D multimodal Aether auto-encoding processor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
authors = [{name = "Dr. Matladi Maxwell Moagi"}]
license = {text = "MIT"}
keywords = ["virtual-machine", "bytecode", "autoencoder", "3d-rom", "4d", "multimodal", "ann"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.urls]
Repository = "https://github.com/Lord-Xido/Jarvis-X/tree/main/sdk/vann_rom_sdk"
Issues = "https://github.com/Lord-Xido/Jarvis-X/issues"

[project.scripts]
vann-rom = "vann_rom_sdk.cli:main"
vann-rom-ide = "vann_rom_sdk.ide:main"

[tool.setuptools.packages.find]
where = ["src"]
