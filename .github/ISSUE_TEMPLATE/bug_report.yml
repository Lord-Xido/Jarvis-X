name: Bug report
description: Report a reproducible defect in canonical Jarvis-X code
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Do not include secrets, private data or exploit details that require coordinated disclosure.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Parser or assembler
        - Bytecode or decoder
        - VM execution
        - Ledger or persistence
        - Sparse geometry
        - Hugging Face integration
        - CI or packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Defect summary
      description: Describe the observed behavior precisely.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code, bytecode or command sequence that reproduces the defect.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python/compiler version, hardware when relevant, and installed dependency versions.
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or additional evidence
      description: Remove secrets and personal data before pasting logs.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue or pull request.
          required: true
        - label: This is not a private vulnerability report.
          required: true
        - label: The reproduction does not contain secrets or sensitive personal information.
          required: true
