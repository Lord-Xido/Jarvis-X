name: Clinic3D synthetic 3D bitwise staging
on:
  pull_request:
    paths:
      - 'apps/clinic3d/**'
      - '.github/workflows/clinic3d-bitwise-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/clinic3d
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Unit and adversarial tests
        run: npm test
      - name: Synthetic 120-case matrix
        run: npm run simulate
      - name: HTTP smoke test
        run: npm run smoke
