name: Phi_M 3D research checks

on:
  pull_request:
    paths:
      - 'src/jarvisx/dr_moagi_phi_m_3d.py'
      - 'tests/test_dr_moagi_phi_m_3d.py'
      - 'docs/DR_MOAGI_PHI_M_3D_OPERATOR.md'
      - '.github/workflows/phi-m-3d.yml'
  push:
    branches: [main]
    paths:
      - 'src/jarvisx/dr_moagi_phi_m_3d.py'
      - 'tests/test_dr_moagi_phi_m_3d.py'
      - '.github/workflows/phi-m-3d.yml'
  workflow_dispatch:

jobs:
  phi-m-mathematics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test dependencies
        run: python -m pip install 'numpy>=1.24,<2.3' 'pytest>=8'
      - name: Validate numerical derivatives, graph isolation and bounds
        run: PYTHONPATH=src python -m pytest -q -o addopts='' tests/test_dr_moagi_phi_m_3d.py
      - name: Independent numerical self-test
        run: PYTHONPATH=src python -m jarvisx.dr_moagi_phi_m_3d --self-test
