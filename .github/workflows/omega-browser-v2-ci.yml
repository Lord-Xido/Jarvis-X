name: Moagi Omega Browser V2 CI

on:
  push:
    branches: [main, develop]
    paths:
      - "omega-browser-v2/**"
      - ".github/workflows/omega-browser-v2-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "omega-browser-v2/**"
      - ".github/workflows/omega-browser-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-browser-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: none

      - name: Verify Java runtime
        run: java -version

      - name: Make scripts executable
        working-directory: omega-browser-v2
        run: chmod +x build.sh test.sh

      - name: Run kernel self-test
        working-directory: omega-browser-v2
        run: ./test.sh

      - name: Build executable JAR
        working-directory: omega-browser-v2
        run: ./build.sh

      - name: Verify packaged entry point
        working-directory: omega-browser-v2
        run: |
          test -s dist/moagi-omega-browser-v2.jar
          jar --describe-module --file dist/moagi-omega-browser-v2.jar || true
          sha256sum dist/moagi-omega-browser-v2.jar | tee dist/moagi-omega-browser-v2.jar.sha256

      - name: Upload verified browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: moagi-omega-browser-v2-${{ github.sha }}
          path: |
            omega-browser-v2/dist/moagi-omega-browser-v2.jar
            omega-browser-v2/dist/moagi-omega-browser-v2.jar.sha256
          if-no-files-found: error
          retention-days: 14
