name: Deploy consultancy SaaS to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/jarvisx/saas/**"
      - "Dockerfile.saas"
      - "pyproject.toml"
      - ".github/workflows/deploy-cloud-run.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: dr-moagi-consultancy-saas
  REPOSITORY: consultancy-saas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -f Dockerfile.saas -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --port 8080 \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-secrets "DM_DATABASE_URL=dm-database-url:latest,DM_TOKEN_SECRET=dm-token-secret:latest,DM_BOOTSTRAP_TOKEN=dm-bootstrap-token:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest" \
            --min-instances 0 \
            --max-instances 20 \
            --concurrency 40 \
            --cpu 1 \
            --memory 1Gi \
            --no-allow-unauthenticated
