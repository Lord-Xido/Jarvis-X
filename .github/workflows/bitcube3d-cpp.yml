name: BitCube3D C++ SDK
on:
  pull_request:
    paths:
      - "native/bitcube3d/**"
      - "src/jarvisx/bitcube3d_b3d1.py"
      - "tests/test_bitcube3d_b3d1.py"
      - "tools/verify-b3d1-golden.mjs"
      - ".github/workflows/bitcube3d-cpp.yml"
  push:
    branches: [main]
    paths:
      - "native/bitcube3d/**"
      - "src/jarvisx/bitcube3d_b3d1.py"
      - "tests/test_bitcube3d_b3d1.py"
      - "tools/verify-b3d1-golden.mjs"
      - ".github/workflows/bitcube3d-cpp.yml"
permissions:
  contents: read
jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S native/bitcube3d -B build/bitcube3d -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/bitcube3d --parallel 2
      - name: Test
        run: ctest --test-dir build/bitcube3d --output-on-failure

  javascript:
    name: Node B3D1 independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact B3D1 golden snapshot bytes
        run: node tools/verify-b3d1-golden.mjs
