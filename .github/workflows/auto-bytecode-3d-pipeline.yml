name: Auto Bytecode 3D Pipeline

on:
  push:
    paths:
      - 'apps/auto-bytecode-3d-pipeline/**'
      - '.github/workflows/auto-bytecode-3d-pipeline.yml'
  pull_request:
    paths:
      - 'apps/auto-bytecode-3d-pipeline/**'
      - '.github/workflows/auto-bytecode-3d-pipeline.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-file app contract
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          path = Path('apps/auto-bytecode-3d-pipeline/index.html')
          text = path.read_text(encoding='utf-8')

          required = [
              'AUTO-EXECUTING BYTECODE VIRTUAL MACHINE & GEOMETRY PIPELINE',
              'VISUALIZATION / SIMULATION',
              'LDX.V3',
              'MAT4.MUL',
              'RAST.DIR',
              'SYNC.FB',
              'JMP.RET',
              'buildGeometryFromBytecode',
              'advanceBytecodeStep',
              'requestAnimationFrame(animate)',
              'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
          ]

          for token in required:
              assert token in text, token

          required_ids = {
              'canvas-container', 'exec-status', 'pc-counter', 'cycle-badge',
              'slider-depth', 'slider-clock', 'btn-toggle-auto', 'btn-step',
              'btn-reset', 'reg-r1', 'reg-r2', 'reg-r3', 'reg-r5'
          }

          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value:
                          self.ids.add(value)

          parser = IDs()
          parser.feed(text)
          assert required_ids <= parser.ids
          PY
