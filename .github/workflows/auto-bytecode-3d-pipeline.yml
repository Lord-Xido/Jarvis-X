name: Auto Bytecode 3D Pipeline\n\non:\n  push:\n    paths:\n      - 'apps/auto-bytecode-3d-pipeline/**'\n      - '.github/workflows/auto-bytecode-3d-pipeline.yml'\n  pull_request:\n    paths:\n      - 'apps/auto-bytecode-3d-pipeline/**'\n      - '.github/workflows/auto-bytecode-3d-pipeline.yml'\n\njobs:\n  static-contract:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Validate single-file app contract\n        run: |\n          python - <<'PY'\n          from html.parser import HTMLParser\n          from pathlib import Path\n\n          path = Path('apps/auto-bytecode-3d-pipeline/index.html')\n          text = path.read_text(encoding='utf-8')\n\n          required = [\n              'AUTO-EXECUTING BYTECODE VIRTUAL MACHINE & GEOMETRY PIPELINE',\n              'VISUALIZATION / SIMULATION',\n              'LDX.V3',\n              'MAT4.MUL',\n              'RAST.DIR',\n              'SYNC.FB',\n              'JMP.RET',\n              'buildGeometryFromBytecode',\n              'advanceBytecodeStep',\n              'requestAnimationFrame(animate)',\n              'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',\n          ]\n\n          for token in required:\n              assert token in text, token\n\n          required_ids = {\n              'canvas-container', 'exec-status', 'pc-counter', 'cycle-badge',\n              'slider-depth', 'slider-clock', 'btn-toggle-auto', 'btn-step',\n              'btn-reset', 'reg-r1', 'reg-r2', 'reg-r3', 'reg-r5'\n          }\n\n          class IDs(HTMLParser):\n              def __init__(self):\n                  super().__init__()\n                  self.ids = set()\n              def handle_starttag(self, tag, attrs):\n                  for key, value in attrs:\n                      if key == 'id' and value:\n                          self.ids.add(value)\n\n          parser = IDs()\n          parser.feed(text)\n          assert required_ids <= parser.ids\n          PY\n