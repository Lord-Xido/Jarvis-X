name: Hyper3D Runtime

on:
  push:
    branches: [main, develop]
    paths:
      - "src/jarvisx/hyper3d_*.py"
      - "src/jarvisx/_static/hyper3d/**"
      - "tests/test_hyper3d_runtime.py"
      - "docs/HYPER3D_RUNTIME.md"
      - "pyproject.toml"
      - ".github/workflows/hyper3d.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/jarvisx/hyper3d_*.py"
      - "src/jarvisx/_static/hyper3d/**"
      - "tests/test_hyper3d_runtime.py"
      - "docs/HYPER3D_RUNTIME.md"
      - "pyproject.toml"
      - ".github/workflows/hyper3d.yml"

permissions:
  contents: read

concurrency:
  group: hyper3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m py_compile src/jarvisx/hyper3d_runtime.py src/jarvisx/hyper3d_api.py src/jarvisx/hyper3d_cli.py
      - name: Focused tests
        run: pytest -q tests/test_hyper3d_runtime.py --no-cov
