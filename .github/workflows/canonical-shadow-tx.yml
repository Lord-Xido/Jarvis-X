name: Canonical four-surface shadow transaction

on:
  push:
    branches: [main]
    paths:
      - 'reference/canonical_shadow_tx/**'
      - '.github/workflows/canonical-shadow-tx.yml'
  pull_request:
    paths:
      - 'reference/canonical_shadow_tx/**'
      - '.github/workflows/canonical-shadow-tx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-real-backend-conformance:
    name: VM / OS / ANN / 3D shadow commit integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and reference ANN dependencies
        run: python -m pip install -e ".[test]" -r apps/recursive-3d-ann/requirements.txt
      - name: Test candidate-first state, 4 real backends and rollback
        run: python -m unittest discover -s reference/canonical_shadow_tx -p test_bridge.py -v
      - name: Test durable prepare, crash recovery and single-store atomicity
        run: python -m unittest discover -s reference/canonical_shadow_tx -p test_durable.py -v
      - name: Test independently persisted participant recovery and visibility
        run: python -m unittest discover -s reference/canonical_shadow_tx -p test_multiprocess.py -v
      - name: Test authenticated local participant processes and crash recovery
        run: python -m unittest discover -s reference/canonical_shadow_tx -p test_ipc.py -v
      - name: Fail-closed production readiness and decision-authority gate
        run: |
          python -m unittest discover -s reference/canonical_shadow_tx -p test_release_gate.py -v
          python -m reference.canonical_shadow_tx.release_gate --commit "$GITHUB_SHA" > canonical-production-readiness.json
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          evidence = json.loads(Path('canonical-production-readiness.json').read_text())
          assert evidence['production_readiness'] == 'BLOCKED'
          assert evidence['production_deployment_allowed'] is False
          assert len(evidence['required_unverified']) == 8
          attempt = subprocess.run(
              [sys.executable, '-m', 'reference.canonical_shadow_tx.release_gate',
               '--require-production'],
              text=True, capture_output=True, check=False,
          )
          assert attempt.returncode == 2, (attempt.stdout, attempt.stderr)
          assert json.loads(attempt.stdout)['production_readiness'] == 'BLOCKED'
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - name: Check authenticated process smoke receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import secrets
          import subprocess
          import sys
          import tempfile
          import time
          import torch
          from reference.canonical_shadow_tx.bridge import (
              observe_ann, observe_geometry, observe_os, observe_vm,
          )
          from reference.canonical_shadow_tx.ipc import IPCCoordinator, PeerClient
          torch.set_num_threads(2)
          frames = tuple(sorted(
              (observe_ann(), observe_geometry(), observe_os(), observe_vm()),
              key=lambda f: f.domain,
          ))
          domains = ('ann', 'geometry', 'os', 'vm')
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              token = secrets.token_urlsafe(48)
              env = dict(os.environ, JARVISX_SHADOW_IPC_SECRET=token)
              children = []
              try:
                  for domain in domains:
                      children.append(subprocess.Popen(
                          [sys.executable, '-m', 'reference.canonical_shadow_tx.ipc',
                           str(root), 'serve', '--domain', domain],
                          env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      ))
                  for domain in domains:
                      for _ in range(120):
                          try:
                              if PeerClient(root, domain, token.encode(), 0.2).call('verify')['verified']:
                                  break
                          except OSError:
                              time.sleep(0.025)
                      else:
                          raise RuntimeError('participant process failed to start')
                  with IPCCoordinator(root, secret=token.encode()) as coordinator:
                      coordinator.prepare('ci-rpc-001', frames)
                      try:
                          coordinator.approve(
                              'ci-rpc-001', approve=True,
                              fault=lambda point: (_ for _ in ()).throw(
                                  OSError('injected post-decision interruption')
                              ) if point == 'after_apply_ann' else None,
                          )
                      except OSError:
                          pass
                  with IPCCoordinator(root, secret=token.encode()) as coordinator:
                      assert coordinator.decision_status('ci-rpc-001') == 'COMMIT_DECIDED'
                      assert coordinator.recover() == {'ci-rpc-001': 'COMPLETE'}
                      assert coordinator.coordinated_read('ci-rpc-001') == frames
                      data = coordinator.receipt('ci-rpc-001')
                      assert data['complete']['status'] == 'COMPLETE'
                      assert data['acked_domains'] == list(domains)
                      data['test_authority'] = 'four independent loopback Unix socket processes, shadow only'
                      Path('canonical-authenticated-process-receipt.json').write_text(
                          json.dumps(data, indent=2, sort_keys=True) + '\n'
                      )
                      print(json.dumps(data, indent=2, sort_keys=True))
              finally:
                  for child in children:
                      child.terminate()
                  for child in children:
                      try:
                          child.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          child.kill()
                          child.wait(timeout=5)
          PY
      - name: Generate separate-participant recovery receipt
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import torch
          from reference.canonical_shadow_tx.bridge import (
              observe_ann, observe_geometry, observe_os, observe_vm,
          )
          from reference.canonical_shadow_tx.multiprocess import Coordinator
          torch.set_num_threads(2)
          frames = tuple(sorted(
              (observe_ann(), observe_geometry(), observe_os(), observe_vm()),
              key=lambda part: part.domain,
          ))
          with tempfile.TemporaryDirectory() as tmp:
              with Coordinator(Path(tmp)) as coordinator:
                  coordinator.prepare('cross-participant-001', frames)
                  try:
                      coordinator.approve(
                          'cross-participant-001', approve=True,
                          fault=lambda point: (_ for _ in ()).throw(
                              OSError('simulated crash after first commit')
                          ) if point == 'after_apply_ann' else None,
                      )
                  except OSError:
                      pass
              with Coordinator(Path(tmp)) as recovered:
                  assert recovered.decision_status('cross-participant-001') == 'COMMIT_DECIDED'
                  assert recovered.recover() == {'cross-participant-001': 'COMPLETE'}
                  assert recovered.coordinated_read('cross-participant-001') == frames
                  receipt = recovered.receipt('cross-participant-001')
                  assert receipt['complete']['status'] == 'COMPLETE'
                  assert receipt['complete']['external_evidence'] == 'NOT_APPLICABLE'
                  assert receipt['acked_domains'] == ['ann', 'geometry', 'os', 'vm']
                  Path('canonical-separate-participants-receipt.json').write_text(
                      json.dumps(receipt, indent=2, sort_keys=True) + '\n'
                  )
                  print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Generate durable recovery receipt against real isolated backends
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from reference.canonical_shadow_tx.bridge import (
              observe_ann, observe_geometry, observe_os, observe_vm,
          )
          from reference.canonical_shadow_tx.durable import DurableShadowStore, recovery_receipt
          import torch
          torch.set_num_threads(2)
          frames = tuple(sorted(
              (observe_ann(), observe_geometry(), observe_os(), observe_vm()),
              key=lambda item: item.domain,
          ))
          with tempfile.TemporaryDirectory() as folder:
              database = Path(folder) / 'durable-shadow.sqlite3'
              with DurableShadowStore(database) as store:
                  store.prepare('ci-verified-001', frames)
                  assert store.epoch() == 0
                  assert store.pending() == ('ci-verified-001',)
                  commit = store.commit('ci-verified-001', approve=True)
                  assert store.verify() and commit.epoch == 1
              receipt = recovery_receipt(database, 'ci-verified-001')
              assert receipt['verified'] is True
              assert receipt['epoch'] == 1 and receipt['pending'] == []
              receipt['commit_receipt'] = commit.as_dict()
              Path('canonical-durable-receipt.json').write_text(
                  json.dumps(receipt, indent=2, sort_keys=True) + '\n'
              )
              print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Produce machine-readable independent shadow receipt
        run: |
          python -m reference.canonical_shadow_tx.bridge > canonical-shadow-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('canonical-shadow-receipt.json').read_text())
          assert result['backend_domains'] == ['ann', 'geometry', 'os', 'vm']
          assert result['epoch'] == 1
          assert result['gates']['external_evidence'] == 'NOT_APPLICABLE'
          assert result['receipt'] == 'verified'
          assert result['authority'] == 'shadow-only/in-memory'
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-shadow-receipt
          path: |
            canonical-shadow-receipt.json
            canonical-durable-receipt.json
            canonical-separate-participants-receipt.json
            canonical-authenticated-process-receipt.json
            canonical-production-readiness.json
          if-no-files-found: error
