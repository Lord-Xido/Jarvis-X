name: Multimodal Evidence Runtime

on:
  push:
    paths:
      - "src/jarvisx/multimodal_evidence_runtime.py"
      - "tests/test_multimodal_evidence_runtime.py"
      - "docs/research/MULTIMODAL_EVIDENCE_RUNTIME.md"
      - ".github/workflows/multimodal-evidence-runtime.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/jarvisx/multimodal_evidence_runtime.py"
      - "tests/test_multimodal_evidence_runtime.py"
      - "docs/research/MULTIMODAL_EVIDENCE_RUNTIME.md"
      - ".github/workflows/multimodal-evidence-runtime.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile runtime
        run: python -m py_compile src/jarvisx/multimodal_evidence_runtime.py

      - name: Test runtime
        run: pytest tests/test_multimodal_evidence_runtime.py -q --no-cov

      - name: Execute deterministic reference run
        run: |
          python -m jarvisx.multimodal_evidence_runtime \
            --output artifacts/multimodal-evidence-runtime.json
          python -m json.tool artifacts/multimodal-evidence-runtime.json >/dev/null

      - name: Verify receipt boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/multimodal-evidence-runtime.json")
          report = json.loads(path.read_text())
          assert report["schema_version"] == "jarvisx.multimodal-evidence-runtime.v1"
          assert "production media decoding" in report["claim_boundary"]["adapter_boundary"]
          assert any(
              row["segment"]["modality"] == "audio"
              and row["segment"]["time_span"] is not None
              for row in report["evidence"]
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: multimodal-evidence-runtime
          path: artifacts/multimodal-evidence-runtime.json
          retention-days: 90
