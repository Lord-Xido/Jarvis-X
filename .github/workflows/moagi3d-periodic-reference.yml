name: Moagi3D periodic numerical reference
on:
  push:
    paths:
      - 'reference/moagi3d_periodic_reference/**'
      - '.github/workflows/moagi3d-periodic-reference.yml'
  pull_request:
    paths:
      - 'reference/moagi3d_periodic_reference/**'
      - '.github/workflows/moagi3d-periodic-reference.yml'
jobs:
  numerical-reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical dependency
        run: python -m pip install 'numpy>=1.24,<2.3'
      - name: Run numerical regressions
        working-directory: reference/moagi3d_periodic_reference
        run: python -m unittest -q test_engine.py
