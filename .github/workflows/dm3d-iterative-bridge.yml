name: DM3D iterative DOCX public bridge

on:
  push:
    paths:
      - "reference/dm3d_document_bridge/v3_iterative_adapter.py"
      - "reference/dm3d_document_bridge/test_v3_iterative_adapter.py"
      - "reference/dm3d_document_bridge/V3_ITERATIVE_BRIDGE.md"
      - ".github/workflows/dm3d-iterative-bridge.yml"
  pull_request:
    paths:
      - "reference/dm3d_document_bridge/v3_iterative_adapter.py"
      - "reference/dm3d_document_bridge/test_v3_iterative_adapter.py"
      - "reference/dm3d_document_bridge/V3_ITERATIVE_BRIDGE.md"
      - ".github/workflows/dm3d-iterative-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run public DOCX/3D bridge synthetic regression tests
        working-directory: reference/dm3d_document_bridge
        run: python -m unittest -q test_v3_iterative_adapter.py
      - name: Verify public standalone 3D encode/decode regression
        working-directory: reference/dm3d_document_bridge
        run: python -m unittest -q test_codec.py
      - name: Byte-compile public bridge
        run: python -m py_compile reference/dm3d_document_bridge/v3_iterative_adapter.py
