name: Dr Moagi 3D Image ISA

on:
  push:
    paths:
      - 'src/jarvisx/image_isa3d.py'
      - 'tests/test_image_isa3d.py'
      - 'docs/DR_MOAGI_IMAGE_ISA_3D.md'
      - '.github/workflows/dr-moagi-image-isa3d.yml'
  pull_request:
    paths:
      - 'src/jarvisx/image_isa3d.py'
      - 'tests/test_image_isa3d.py'
      - 'docs/DR_MOAGI_IMAGE_ISA_3D.md'
      - '.github/workflows/dr-moagi-image-isa3d.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest -q -o addopts='' tests/test_image_isa3d.py
