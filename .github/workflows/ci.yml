name: Jarvis-X CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: jarvisx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -r requirements.txt
          pip install flake8
      - name: Syntax and undefined-name checks
        run: flake8 src/jarvisx tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: pytest -v --tb=short
      - name: Generate coverage report
        if: matrix.python-version == '3.11'
        run: pytest --cov=src/jarvisx --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - tests/test_assembler.py
          - tests/test_parser.py
          - tests/test_vm.py
          - tests/test_ann30d.py
          - tests/test_ann30d_safe.py
          - tests/test_abstraction3d.py
          - tests/test_ledger.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -r requirements.txt
      - name: Run ${{ matrix.test-file }}
        run: pytest -q ${{ matrix.test-file }} --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install mypy
      - name: Type check
        run: mypy src/jarvisx --ignore-missing-imports
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install black isort
      - name: Check formatting
        run: black --check src/jarvisx tests
        continue-on-error: true
      - name: Check import sorting
        run: isort --check-only src/jarvisx tests
        continue-on-error: true
