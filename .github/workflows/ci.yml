name: Jarvis-X CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Compile optional self-referential runtime
        run: python -m py_compile examples/self_referential_triton_engine.py

      - name: Reject syntax errors and undefined names
        run: flake8 src/jarvisx tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check canonical formatting
        run: >-
          black --check --diff
          setup.py
          src/jarvisx/core.py
          src/jarvisx/ledger.py
          src/jarvisx/ledger_store.py
          src/jarvisx/fractional_smoothing_3d.py
          src/jarvisx/inward4d_ann.py
          src/jarvisx/kinetic_runtime.py
          src/jarvisx/dr_moagi_kinetic_system.py
          src/jarvisx/dr_moagi_pdf_bytecode.py
          src/jarvisx/dr_moagi_pdf_bytecode_cli.py
          src/jarvisx/dr_moagi_animation_loop.py
          src/jarvisx/dr_moagi_animation_pdf.py
          src/jarvisx/quantum_text.py
          src/jarvisx/verification.py
          tests/test_vm.py
          tests/test_ledger.py
          tests/test_fractional_smoothing_3d.py
          tests/test_inward4d_ann.py
          tests/test_kinetic_runtime.py
          tests/test_dr_moagi_kinetic_system.py
          tests/test_dr_moagi_pdf_bytecode.py
          tests/test_dr_moagi_animation_loop.py
          tests/test_dr_moagi_animation_pdf.py
          tests/test_quantum_text.py
          tests/test_verification.py

      - name: Check canonical import order
        run: >-
          isort --check-only --diff
          setup.py
          src/jarvisx/core.py
          src/jarvisx/ledger.py
          src/jarvisx/ledger_store.py
          src/jarvisx/fractional_smoothing_3d.py
          src/jarvisx/inward4d_ann.py
          src/jarvisx/kinetic_runtime.py
          src/jarvisx/dr_moagi_kinetic_system.py
          src/jarvisx/dr_moagi_pdf_bytecode.py
          src/jarvisx/dr_moagi_pdf_bytecode_cli.py
          src/jarvisx/dr_moagi_animation_loop.py
          src/jarvisx/dr_moagi_animation_pdf.py
          src/jarvisx/quantum_text.py
          src/jarvisx/verification.py
          tests/test_vm.py
          tests/test_ledger.py
          tests/test_fractional_smoothing_3d.py
          tests/test_inward4d_ann.py
          tests/test_kinetic_runtime.py
          tests/test_dr_moagi_kinetic_system.py
          tests/test_dr_moagi_pdf_bytecode.py
          tests/test_dr_moagi_animation_loop.py
          tests/test_dr_moagi_animation_pdf.py
          tests/test_quantum_text.py
          tests/test_verification.py

      - name: Type-check package
        run: mypy src/jarvisx --ignore-missing-imports

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/jarvisx-wheel-test
          /tmp/jarvisx-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/jarvisx-wheel-test/bin/python -c "from jarvisx.core import CodexVM; assert CodexVM"

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and auditor
        run: python -m pip install -e . pip-audit

      - name: Audit Python dependencies
        run: pip-audit
