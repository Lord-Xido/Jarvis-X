name: ANN3D image-memory (isolated)

on:
  pull_request:
    paths:
      - 'experimental/ann3d_image_memory/**'
      - '.github/workflows/ann3d-image-memory.yml'
  push:
    paths:
      - 'experimental/ann3d_image_memory/**'
      - '.github/workflows/ann3d-image-memory.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Five deterministic unit tests
        working-directory: experimental/ann3d_image_memory
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Small end-to-end archive and reconstruction
        working-directory: experimental/ann3d_image_memory
        run: |
          python ann3d_memory.py --width 32 --height 24 --depth 8 --steps 4 --archive /tmp/ann3d_memory.npz --preview /tmp/ann3d_preview.png
