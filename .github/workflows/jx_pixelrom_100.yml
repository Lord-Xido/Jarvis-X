name: JX Pixel ROM 100 (C++17)
on:
  push:
    paths:
      - 'research/jx_pixelrom_100/**'
      - '.github/workflows/jx_pixelrom_100.yml'
  pull_request:
    paths:
      - 'research/jx_pixelrom_100/**'
      - '.github/workflows/jx_pixelrom_100.yml'
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libpng-dev libssl-dev zlib1g-dev python3-pil
      - name: Build and verify 100-bank Pixel ROM
        env:
          CXX: ${{ matrix.cxx }}
        run: bash research/jx_pixelrom_100/run_pipeline.sh "$RUNNER_TEMP/jxprom_run"
