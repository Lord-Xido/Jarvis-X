name: Dr Moagi Cloud OS

on:
  pull_request:
    branches: [main]
    paths:
      - "src/jarvisx/cloud_os.py"
      - "src/jarvisx/cloud_service.py"
      - "src/jarvisx/bytecode3d.py"
      - "src/jarvisx/qvector3d.py"
      - "src/jarvisx/qvector_cloud.py"
      - "src/jarvisx/qvector_bytecode3d.py"
      - "src/jarvisx/qvector_v2.py"
      - "src/jarvisx/qvector_field_bytecode.py"
      - "src/jarvisx/sparse_cube64.py"
      - "src/jarvisx/dr_moagi_3d_1000x.py"
      - "src/jarvisx/dr_moagi_operational_console.py"
      - "src/jarvisx/dr_moagi_recursive_geometry_optimizer.py"
      - "src/jarvisx/static/dr_moagi_operational_console.html"
      - "tests/test_cloud_os.py"
      - "tests/test_cloud_service.py"
      - "tests/test_cloud_service_v2.py"
      - "tests/test_bytecode3d.py"
      - "tests/test_qvector3d.py"
      - "tests/test_qvector_v2.py"
      - "tests/test_qvector_field_bytecode.py"
      - "tests/test_qvector_optimizer_v2.py"
      - "tests/test_sparse_cube64.py"
      - "tests/test_dr_moagi_3d_1000x.py"
      - "tests/test_dr_moagi_operational_console.py"
      - "tests/test_dr_moagi_recursive_geometry_optimizer.py"
      - "docs/DR_MOAGI_CLOUD_OS.md"
      - "docs/DR_MOAGI_BYTECODE3D.md"
      - "docs/DR_MOAGI_QVECTOR3D.md"
      - "docs/DR_MOAGI_QVECTOR3D_V2.md"
      - "docs/DR_MOAGI_SPARSE_CUBE64.md"
      - "docs/DR_MOAGI_3D_1000X_ENGINE.md"
      - "docs/DR_MOAGI_OPERATIONAL_CONSOLE.md"
      - "docs/DR_MOAGI_RECURSIVE_GEOMETRY_OPTIMIZER.md"
      - "examples/sota_baseline_template.json"
      - "examples/bytecode3d_demo.py"
      - "examples/qvector3d_demo.py"
      - "examples/qvector_field_v2_demo.py"
      - "pyproject.toml"
      - "Dockerfile.cloud"
      - "docker-compose.cloud.yml"
      - ".github/workflows/cloud-os.yml"

permissions:
  contents: read

jobs:
  cloud-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Compile
        run: >-
          python -m compileall -q
          src/jarvisx/cloud_os.py
          src/jarvisx/cloud_service.py
          src/jarvisx/bytecode3d.py
          src/jarvisx/qvector3d.py
          src/jarvisx/qvector_cloud.py
          src/jarvisx/qvector_bytecode3d.py
          src/jarvisx/qvector_v2.py
          src/jarvisx/qvector_field_bytecode.py
          src/jarvisx/sparse_cube64.py
          src/jarvisx/dr_moagi_3d_1000x.py
          src/jarvisx/dr_moagi_operational_console.py
          src/jarvisx/dr_moagi_recursive_geometry_optimizer.py
          tests/test_cloud_os.py
          tests/test_cloud_service.py
          tests/test_cloud_service_v2.py
          tests/test_bytecode3d.py
          tests/test_qvector3d.py
          tests/test_qvector_v2.py
          tests/test_qvector_field_bytecode.py
          tests/test_qvector_optimizer_v2.py
          tests/test_sparse_cube64.py
          tests/test_dr_moagi_3d_1000x.py
          tests/test_dr_moagi_operational_console.py
          tests/test_dr_moagi_recursive_geometry_optimizer.py
          examples/bytecode3d_demo.py
          examples/qvector3d_demo.py
          examples/qvector_field_v2_demo.py

      - name: Test cloud OS, Q16.16x3, Cube64, sparse 1000x engine, live console, and recursive geometry optimizer
        run: >-
          pytest -q
          tests/test_cloud_os.py
          tests/test_cloud_service.py
          tests/test_cloud_service_v2.py
          tests/test_bytecode3d.py
          tests/test_qvector3d.py
          tests/test_qvector_v2.py
          tests/test_qvector_field_bytecode.py
          tests/test_qvector_optimizer_v2.py
          tests/test_sparse_cube64.py
          tests/test_dr_moagi_3d_1000x.py
          tests/test_dr_moagi_operational_console.py
          tests/test_dr_moagi_recursive_geometry_optimizer.py
          --no-cov

      - name: Run sparse 1000x engine smoke cycle
        run: >-
          python -c "from jarvisx.dr_moagi_3d_1000x import DrMoagi3D1000xEngine,EngineConfig; e=DrMoagi3D1000xEngine(EngineConfig(max_active_tiles=64)); e.ingest_bytes(b'cloud multimodal smoke'); r=e.cycle(); assert r.active_tiles == 64; assert r.work_reduction_factor > 0"

      - name: Validate operational console authoritative state
        run: >-
          python -c "from jarvisx.dr_moagi_operational_console import OperationalRuntime; s=OperationalRuntime(max_active_tiles=1000).snapshot(); t=s['telemetry']; assert t['virtual_voxels'] == 1000000000; assert t['active_voxels'] == 1000000; assert t['work_reduction_factor'] == 1000.0; assert s['contract']['visualization_role'] == 'render-only'"

      - name: Validate recursive geometry commit/rollback contract
        run: >-
          python -c "from jarvisx.dr_moagi_recursive_geometry_optimizer import GeometryEvaluator,RecursiveGeometryOptimizer; e=GeometryEvaluator(suite={'text': b'recursive-ci'*64},warmup_cycles=0,measured_cycles=1); o=RecursiveGeometryOptimizer(e,commit_margin=1.0); before=o.incumbent.geometry; event=o.step(); report=o.report(); assert not event.accepted; assert o.incumbent.geometry == before; assert not report['claims']['external_sota_gate_passed']; assert report['claims']['source_self_modification'] is False"

      - name: Run scalar bytecode smoke demo
        env:
          JARVISX_CLOUD_LEDGER: /tmp/jarvisx-cloud-os-demo-ledger.jsonl
        run: python examples/bytecode3d_demo.py

      - name: Run Q16.16x3 bytecode smoke demo
        run: python examples/qvector3d_demo.py

      - name: Run Q16.16x3 field-engine v2 smoke demo
        run: python examples/qvector_field_v2_demo.py

      - name: Import API
        env:
          JARVISX_CLOUD_LEDGER: /tmp/jarvisx-cloud-os-ledger.jsonl
        run: >-
          python -c "from jarvisx.cloud_service import app; assert app.title; assert app.version == '2.0.0'"

      - name: Build container
        run: docker build -f Dockerfile.cloud -t jarvisx-cloud-os:pr .
