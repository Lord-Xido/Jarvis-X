name: Dr Moagi Cloud OS

on:
  pull_request:
    branches: [main]
    paths:
      - "src/jarvisx/cloud_os.py"
      - "src/jarvisx/cloud_service.py"
      - "tests/test_cloud_os.py"
      - "Dockerfile.cloud"
      - "docker-compose.cloud.yml"
      - ".github/workflows/cloud-os.yml"

permissions:
  contents: read

jobs:
  cloud-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Compile
        run: python -m compileall -q src/jarvisx/cloud_os.py src/jarvisx/cloud_service.py tests/test_cloud_os.py

      - name: Test cloud OS
        run: pytest -q tests/test_cloud_os.py --no-cov

      - name: Import API
        env:
          JARVISX_CLOUD_LEDGER: /tmp/jarvisx-cloud-os-ledger.jsonl
        run: python -c "from jarvisx.cloud_service import app; assert app.title"

      - name: Build container
        run: docker build -f Dockerfile.cloud -t jarvisx-cloud-os:pr .
