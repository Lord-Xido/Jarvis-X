name: Spatial Q16.16 3D reference
on:
  push:
    paths:
      - 'cpp_runtime/spatial_q1616_contraction_v1/**'
      - '.github/workflows/spatial-q1616-contraction.yml'
  pull_request:
    paths:
      - 'cpp_runtime/spatial_q1616_contraction_v1/**'
      - '.github/workflows/spatial-q1616-contraction.yml'
jobs:
  cxx17:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp_runtime/spatial_q1616_contraction_v1 -B /tmp/jx-q16-build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build /tmp/jx-q16-build -j2
      - name: Test
        run: ctest --test-dir /tmp/jx-q16-build --output-on-failure
      - name: Million-point demonstration
        run: /tmp/jx-q16-build/spatial3d_demo --count=1000000 --steps=1 --scale=0.5
