name: DMVX-1 Transactional Firmware

on:
  push:
    paths:
      - "reference/dmvx_1/**"
      - ".github/workflows/dmvx-reference.yml"
  pull_request:
    paths:
      - "reference/dmvx_1/**"
      - ".github/workflows/dmvx-reference.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assemble normative ROM source
        working-directory: reference/dmvx_1
        run: cat src/fragments/dm_voxi_firmware.asm/*.part > dm_voxi_firmware.asm

      - name: Compile reference VM
        run: python -m compileall -q reference/dmvx_1

      - name: Verify package hashes
        working-directory: reference/dmvx_1
        run: sha256sum -c SHA256SUMS.txt

      - name: Run transactional invariant tests
        working-directory: reference/dmvx_1
        run: python -m unittest -v test_reference_vm.py

      - name: Reproduce canonical transaction receipt
        working-directory: reference/dmvx_1
        run: |
          python reference_vm.py 0.1 -0.2 0.3 -0.4 > /tmp/dmvx-demo.json
          diff -u demo_output.json /tmp/dmvx-demo.json
