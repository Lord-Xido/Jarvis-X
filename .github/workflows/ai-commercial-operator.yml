name: AI Commercial Auto Operator
on:
  push:
    branches: [main]
    paths:
      - 'apps/ai-commercial-operator/**'
      - '.github/workflows/ai-commercial-operator.yml'
  pull_request:
    paths:
      - 'apps/ai-commercial-operator/**'
      - '.github/workflows/ai-commercial-operator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-model-and-governance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai-commercial-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax
        run: python -m py_compile jarvis_x_auto_operator.py test_operator.py
      - name: Test ANN, financial reconciliation and execution gates
        run: python -m unittest -v test_operator
      - name: Execute synthetic demonstration and verify expansion remains blocked
        run: |
          python jarvis_x_auto_operator.py --demo --output "$RUNNER_TEMP/ai-commercial-operator"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "ai-commercial-operator" / "latest_plan.json"
          report = json.loads(p.read_text())
          assert report["execution"] == "PROPOSALS_ONLY"
          assert report["expansion_authorized"] is False
          assert report["approval_gate"]["external_execution_enabled"] is False
          assert report["status"] == "HOLD_UNIT_ECONOMICS"
          print("Verified offline-only no-scale safety gate.")
          PY
