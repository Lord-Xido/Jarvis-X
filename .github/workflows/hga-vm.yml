name: HGA VM

on:
  push:
    paths:
      - "apps/hga-vm/**"
      - ".github/workflows/hga-vm.yml"
  pull_request:
    paths:
      - "apps/hga-vm/**"
      - ".github/workflows/hga-vm.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hga-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/hga-vm/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_hga_vm.py
      - run: python hga_vm.py run --cycles 5 --json
      - run: python hga_vm.py time-block
