name: DM3D Secure Multimedia Codec

on:
  push:
    paths:
      - "cpp_runtime/dm3d_secure_codec/**"
      - "cpp_runtime/dm3d_secure_codec.cmake"
      - "cpp_runtime/CMakeLists.txt"
      - "src/jarvisx/dm3d_secure_bridge.py"
      - "tests/test_dm3d_secure_bridge.py"
      - "docs/DR_MOAGI_DM3D_SECURE_PERMEATION.md"
      - ".github/workflows/dm3d-secure-codec.yml"
  pull_request:
    paths:
      - "cpp_runtime/dm3d_secure_codec/**"
      - "cpp_runtime/dm3d_secure_codec.cmake"
      - "cpp_runtime/CMakeLists.txt"
      - "src/jarvisx/dm3d_secure_bridge.py"
      - "tests/test_dm3d_secure_bridge.py"
      - "docs/DR_MOAGI_DM3D_SECURE_PERMEATION.md"
      - ".github/workflows/dm3d-secure-codec.yml"

permissions:
  contents: read

jobs:
  secure-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Configure
        run: >-
          cmake -S cpp_runtime -B build/cpp-runtime
          -DCMAKE_BUILD_TYPE=Release
          -DJARVISX_BUILD_GL_VISUALIZER=OFF
          -DJARVISX_BUILD_DM3D_SECURE=ON
      - name: Build 3D codec
        run: cmake --build build/cpp-runtime --target jarvisx-dm3d-secure --parallel 2
      - name: Verify native codec and actual binary round-trip
        run: >-
          ctest --test-dir build/cpp-runtime
          -R '^dm3d-secure-' --output-on-failure
      - name: Verify Python suspensory bridge
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest tests/test_dm3d_secure_bridge.py -q -o addopts=''
