name: DM3D volumetric observatory demo checks
on:
  push:
    paths:
      - 'apps/dm3d-volumetric-observatory/**'
      - '.github/workflows/dm3d-volumetric-observatory.yml'
  pull_request:
    paths:
      - 'apps/dm3d-volumetric-observatory/**'
      - '.github/workflows/dm3d-volumetric-observatory.yml'
  workflow_dispatch:

jobs:
  static-demo-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bundled app syntax and evidence disclosures
        run: python -m unittest discover -s apps/dm3d-volumetric-observatory -p 'test_*.py' -v
