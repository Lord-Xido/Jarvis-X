name: DM-vOmegaXi Permeation Transport

on:
  push:
    branches: [main]
    paths:
      - "apps/permeation-transport/**"
      - ".github/workflows/permeation-transport.yml"
  pull_request:
    paths:
      - "apps/permeation-transport/**"
      - ".github/workflows/permeation-transport.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: permeation-transport-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run transport invariants
        run: node --test apps/permeation-transport/test_core.mjs
      - name: Static artifact smoke check
        run: |
          grep -q "DM-vΩΞ⁺ PERMEATION TRANSPORT CORE" apps/permeation-transport/index.html
          grep -q "performance.now" apps/permeation-transport/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/permeation-transport
      - id: deployment
        uses: actions/deploy-pages@v4
