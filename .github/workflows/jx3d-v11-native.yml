name: JX3D v11 native 3D neural reference
on:
  pull_request:
    paths:
      - 'experiments/jx3d_v11/**'
      - '.github/workflows/jx3d-v11-native.yml'
  push:
    paths:
      - 'experiments/jx3d_v11/**'
      - '.github/workflows/jx3d-v11-native.yml'
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++20 regression test with warnings as errors
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            experiments/jx3d_v11/tests/reference.cpp -o /tmp/jx3d_v11_reference
      - name: Execute 3D bitwise, ANN and routing regression
        run: /tmp/jx3d_v11_reference
