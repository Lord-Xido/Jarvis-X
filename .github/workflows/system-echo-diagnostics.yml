name: System Echo Diagnostics

on:
  push:
    paths:
      - 'apps/system-echo-diagnostics/**'
      - '.github/workflows/system-echo-diagnostics.yml'
  pull_request:
    paths:
      - 'apps/system-echo-diagnostics/**'
      - '.github/workflows/system-echo-diagnostics.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostics app contract
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          path = Path('apps/system-echo-diagnostics/index.html')
          text = path.read_text(encoding='utf-8')

          required_tokens = [
              'JARVIS',
              'ECHO_THROUGH_ACTIVE',
              'VISUAL DIAGNOSTIC SIMULATION',
              'EXECUTION_STREAM',
              'SYSTEM_LOAD',
              'MIC_RESONANCE // SENSOR_LINK',
              'MULTIMODAL_DECODER',
              "let annState = 'IDLE'",
              "state === 'ENCODING'",
              "state === 'PROCESSING'",
              "state === 'DECODING'",
              'navigator.mediaDevices.getUserMedia',
              'createAnalyser',
              'UnrealBloomPass',
              'EffectComposer',
              'buildFractal',
              'clearCoreGroup',
              'composer.render()',
              'requestAnimationFrame(animate)',
              'LOAD_METERS_SYNTHETIC',
              'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
          ]

          for token in required_tokens:
              assert token in text, token

          required_ids = {
              'canvas-container',
              'sys-clock',
              'command-input',
              'bytecode-stream',
              'pc-readout',
              'cpu-load',
              'gpu-load',
              'audio-visualizer',
              'enable-mic-btn',
              'mic-status-text',
              'multimedia-output',
              'ann-state-readout',
          }

          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value:
                          self.ids.add(value)

          parser = IDs()
          parser.feed(text)
          assert required_ids <= parser.ids

          # Public-source safety boundary: no credential value is committed.
          assert 'const API_KEY = "";' not in text
          assert 'window.JARVIS_X_GEMINI_API_KEY || ""' in text
          PY
