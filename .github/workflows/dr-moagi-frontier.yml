name: Dr Moagi Frontier Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "src/jarvisx/dr_moagi_frontier*.py"
      - "tests/test_dr_moagi_frontier.py"
      - "scripts/benchmark_dr_moagi_frontier.py"
      - "docs/DR_MOAGI_FRONTIER_RUNTIME.md"
      - "pyproject.toml"
      - ".github/workflows/dr-moagi-frontier.yml"
  push:
    branches: [main]
    paths:
      - "src/jarvisx/dr_moagi_frontier*.py"
      - "tests/test_dr_moagi_frontier.py"
      - "scripts/benchmark_dr_moagi_frontier.py"
      - "docs/DR_MOAGI_FRONTIER_RUNTIME.md"
      - "pyproject.toml"
      - ".github/workflows/dr-moagi-frontier.yml"

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Frontier regression suite
        run: pytest tests/test_dr_moagi_frontier.py --no-cov
      - name: Empirical internal baseline gate
        run: python scripts/benchmark_dr_moagi_frontier.py
      - name: CLI smoke
        run: jarvisx-dr-moagi-frontier demo --side 16 --cycles 1 --max-iterations 12
