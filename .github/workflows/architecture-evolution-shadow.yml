name: JARVIS-X Architecture Evolution Shadow Validation

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'src/jarvisx/evolution_control.py'
      - 'src/jarvisx/evolution_inventory.json'
      - 'tests/test_evolution_control.py'
      - '.github/workflows/architecture-evolution-shadow.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/jarvisx/evolution_control.py'
      - 'src/jarvisx/evolution_inventory.json'
      - 'tests/test_evolution_control.py'
      - '.github/workflows/architecture-evolution-shadow.yml'

permissions:
  contents: read

jobs:
  shadow-plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independent offline unit tests
        run: python tests/test_evolution_control.py
      - name: Deterministic 1000-candidate shadow search
        env:
          PYTHONPATH: src
        run: |
          python -m jarvisx.evolution_control plan --iterations 1000 --seed 20261027 --output $RUNNER_TEMP/evolution-plan.json
          python -m jarvisx.evolution_control verify $RUNNER_TEMP/evolution-plan.json
