name: DM3D 1MB Lossless Reference

on:
  push:
    paths:
      - "reference/dm3d_1mb_aead/**"
      - ".github/workflows/dm3d-1mb-reference.yml"
  pull_request:
    paths:
      - "reference/dm3d_1mb_aead/**"
      - ".github/workflows/dm3d-1mb-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lossless-codec:
    name: Python ${{ matrix.python-version }} / exact codec
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: reference/dm3d_1mb_aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact 1MB artifact and source digest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(".")
          manifest = json.loads((root / "Dr_Moagi_1MB_3D_Engine_manifest.json").read_text())
          source = (root / "Dr_Moagi_1MB_3D_Engine.py").read_bytes()
          assert len(source) == manifest["source_bytes"] == 1_000_000
          assert hashlib.sha256(source).hexdigest() == manifest["source_sha256"]
          print("Exact source size and SHA-256 verified")
          PY
      - name: Syntax and independent round-trip, tamper and boundary regression
        run: |
          python -m py_compile Dr_Moagi_1MB_3D_Engine.py
          python -m unittest -q test_Dr_Moagi_1MB_3D_Engine.py
      - name: Verify embedded 3D reference vector corpus
        run: python Dr_Moagi_1MB_3D_Engine.py selftest --vectors
