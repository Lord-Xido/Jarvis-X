name: EM-Sig Bounded Emulation

on:
  push:
    branches: [main, develop]
    paths:
      - "src/jarvisx/em_sig_emulation.py"
      - "tests/test_em_sig_emulation.py"
      - "docs/research/EM_SIG_1000_CUBED_EMULATION.md"
      - ".github/workflows/em-sig-emulation.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/jarvisx/em_sig_emulation.py"
      - "tests/test_em_sig_emulation.py"
      - "docs/research/EM_SIG_1000_CUBED_EMULATION.md"
      - ".github/workflows/em-sig-emulation.yml"

permissions:
  contents: read

concurrency:
  group: em-sig-emulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulation:
    name: EM-Sig deterministic research trace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Test bounded emulation
        run: pytest tests/test_em_sig_emulation.py -q --no-cov

      - name: Generate machine-readable trace
        run: >-
          python -m jarvisx.em_sig_emulation
          --bit-count 65536
          --materialized-extent 12
          --seed 42
          --output artifacts/em-sig-emulation.json

      - name: Validate JSON trace
        run: python -m json.tool artifacts/em-sig-emulation.json > /dev/null

      - name: Publish evidence boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("artifacts/em-sig-emulation.json").read_text())
          l4 = report["layers"]["L4_latent"]
          l5 = report["layers"]["L5_residual_correction"]
          timing = report["layers"]["L1_serdes"]["rate_arithmetic"]
          lines = [
              "## EM-Sig bounded emulation",
              "",
              "**Provenance:** simulated",
              f"**Latent fixed point:** {l4['latent_fixed_point']}",
              f"**Residual fixed point:** {l5['fixed_point']}",
              f"**Final observed BER:** {l5['final_observed_ber']:.6g}",
              f"**Finite-stream BER resolution:** {l5['empirical_single_error_resolution']:.6g}",
              f"**1 Tbit at configured serial QPSK rate:** {timing['one_trillion_bits_seconds']:.6g} s",
              "",
              "This workflow is a deterministic software research trace, not RF/photonic hardware telemetry.",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY

      - name: Upload EM-Sig trace
        uses: actions/upload-artifact@v4
        with:
          name: jarvisx-em-sig-emulation-${{ github.sha }}
          path: artifacts/em-sig-emulation.json
          if-no-files-found: error
          retention-days: 90
