name: DM3D recursive HTML kernel

on:
  pull_request:
    paths:
      - "apps/dm3d-recursive-html-kernel/**"
      - ".github/workflows/dm3d-recursive-html-kernel.yml"
  push:
    paths:
      - "apps/dm3d-recursive-html-kernel/**"
      - ".github/workflows/dm3d-recursive-html-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Chromium full-kernel regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure Node (inline JS syntax audit)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify exact codec, ANN, VM, multimodal media, one million cycles and recursive self-boot
        run: python apps/dm3d-recursive-html-kernel/tests/test_kernel.py
