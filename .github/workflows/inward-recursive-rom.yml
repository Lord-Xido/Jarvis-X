name: Inward Recursive ROM

on:
  pull_request:
    paths:
      - "research/inward_recursive_rom/**"
      - ".github/workflows/inward-recursive-rom.yml"
  push:
    branches: [main]
    paths:
      - "research/inward_recursive_rom/**"
      - ".github/workflows/inward-recursive-rom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile reference model
        run: python -m py_compile research/inward_recursive_rom/reference.py research/inward_recursive_rom/test_inward_recursive_rom.py
      - name: Run conformance tests
        run: python -m unittest -v research/inward_recursive_rom/test_inward_recursive_rom.py
      - name: Execute deterministic receipt
        run: python research/inward_recursive_rom/reference.py
