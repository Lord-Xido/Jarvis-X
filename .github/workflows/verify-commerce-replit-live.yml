name: Verify published Jarvis X retail and wholesale demo
on:
  push:
    branches: [verify/commerce-live-20261103]
  pull_request:
    paths:
      - '.github/workflows/verify-commerce-replit-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the published Replit app externally
        env:
          APP_URL: https://limited-beneficial-dehardwarization--maxido3m.replit.app
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error, time
          base=os.environ["APP_URL"]
          def fetch(path, method="GET", body=None):
              request=urllib.request.Request(base+path, data=body,
                  headers={"User-Agent":"JarvisX-Deployment-Verification/1.0",
                           "Accept":"text/html,application/json",
                           "Content-Type":"application/json"},
                  method=method)
              last=None
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(request, timeout=18) as res:
                          content=res.read(120000)
                          print(f"{method} {path}: HTTP {res.status}, {len(content)} B; type={res.headers.get('Content-Type','')}; url={res.url}", flush=True)
                          return res.status,content,res.headers.get("Content-Type","")
                  except urllib.error.HTTPError as err:
                      content=err.read(300)
                      print(f"{method} {path}: HTTP {err.code}; response={content.decode('utf8','replace')[:180]!r}",flush=True)
                      return err.code,content,""
                  except Exception as err:
                      last=err
                      print(f"{method} {path}: transient {type(err).__name__}: {str(err)[:180]}",flush=True)
                      time.sleep(3)
              return 0,str(last).encode(),""
          failures=[]
          status,body,mime=fetch("/")
          if status!=200 or len(body)<150 or b"<html" not in body.lower():
              failures.append("Homepage HTTP 200 + nonempty HTML")
          else:
              print("PASS: homepage delivers HTML",flush=True)
              print("Homepage markers: "+repr(body[:220].decode("utf8","replace")),flush=True)
          status,body,mime=fetch("/healthz")
          try:
              js=json.loads(body)
          except Exception:
              js=None
          if status==200 and isinstance(js,dict) and js.get("ok")==True:
              print("PASS: /healthz JSON reports ok",flush=True)
          else:
              failures.append("GET /healthz JSON ok")
          status,body,mime=fetch("/api/demo")
          try:
              js=json.loads(body)
          except Exception:
              js=None
          if status==200 and isinstance(js,dict) and js.get("plan",{}).get("execution_enabled") is False:
              print("PASS: /api/demo has proposal-only JSON plan",flush=True)
          else:
              failures.append("GET /api/demo returns proposal-only JSON")
          status,body,mime=fetch("/api/plan",method="POST",body=b'{"products":[{"customer_email":"test"}]}')
          if status==400:
              print("PASS: /api/plan rejects malformed/private input",flush=True)
          else:
              failures.append("POST /api/plan rejects malformed input with HTTP 400")
          print("LIVE SMOKE RESULTS: "+("ALL PASS" if not failures else "FAILED: "+", ".join(failures)),flush=True)
          if failures: sys.exit(1)
          PY
