name: VANN-ROM Ω³ SDK

on:
  push:
    paths:
      - "sdk/vann_rom_sdk/**"
      - ".github/workflows/vann-rom-sdk.yml"
  pull_request:
    paths:
      - "sdk/vann_rom_sdk/**"
      - ".github/workflows/vann-rom-sdk.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/vann_rom_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/vann_rom_sdk/pyproject.toml
      - name: Install SDK
        run: python -m pip install .
      - name: Compile sources
        run: python -m compileall -q src tests examples
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Execute VM demonstration
        run: vann-rom demo
