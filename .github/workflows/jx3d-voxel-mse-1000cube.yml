name: JX3D 1000cube voxel MSE objective
on:
  pull_request:
    paths:
      - 'experimental/voxel_mse_1000cube_v1/**'
      - '.github/workflows/jx3d-voxel-mse-1000cube.yml'
  push:
    paths:
      - 'experimental/voxel_mse_1000cube_v1/**'
      - '.github/workflows/jx3d-voxel-mse-1000cube.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voxel-mse-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experimental/voxel_mse_1000cube_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Verify masked 3D loss, autograd, rollback, byte-exact input and deterministic replay
        run: python -m unittest -v test_voxel_mse.py
      - name: Execute bounded reproducible example
        run: python voxel_mse.py --edge 8 --tile 4 --steps 2 --lr 0.3 | tee trace.jsonl
      - name: Archive execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: jx3d-voxel-mse-cpu-evidence
          path: experimental/voxel_mse_1000cube_v1/trace.jsonl
          retention-days: 14
