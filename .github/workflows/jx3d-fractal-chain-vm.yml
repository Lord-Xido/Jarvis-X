name: JX3D Fractal Chain VM
on:
  push:
    paths:
      - 'experimental/fractal_chain_vm/**'
      - '.github/workflows/jx3d-fractal-chain-vm.yml'
  pull_request:
    paths:
      - 'experimental/fractal_chain_vm/**'
      - '.github/workflows/jx3d-fractal-chain-vm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S experimental/fractal_chain_vm -B /tmp/jx3d-fvm-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build /tmp/jx3d-fvm-build --parallel 2
      - name: Verify deterministic contract
        run: ctest --test-dir /tmp/jx3d-fvm-build --output-on-failure
      - name: Measure and report fixed-reference quality
        run: |
          /tmp/jx3d-fvm-build/jx_fractal_quality /tmp/jx3d-fvm-build/fractal_quality.csv
          python3 experimental/fractal_chain_vm/quality_report.py /tmp/jx3d-fvm-build/fractal_quality.csv /tmp/jx3d-fvm-build/fractal_quality.json
      - name: Archive quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: jx3d-quality-${{ strategy.job-index }}
          path: |
            /tmp/jx3d-fvm-build/fractal_quality.csv
            /tmp/jx3d-fvm-build/fractal_quality.json
          retention-days: 14
