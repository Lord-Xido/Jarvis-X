name: CubePNG Neural v6 GHCR gated publication
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cubepng-production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cpp_runtime/cubepng_neural_v6
          file: cpp_runtime/cubepng_neural_v6/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jarvis-x-cubepng:${{ github.sha }}
          provenance: true
          sbom: true
