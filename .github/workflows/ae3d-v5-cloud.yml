name: AE3D v5 Cloud Codec Parity
on:
  pull_request:
    paths:
      - 'cpp_runtime/ae3d_v4/cloud_accel/**'
      - '.github/workflows/ae3d-v5-cloud.yml'
  push:
    paths:
      - 'cpp_runtime/ae3d_v4/cloud_accel/**'
      - '.github/workflows/ae3d-v5-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cpp_runtime/ae3d_v4/cloud_accel/requirements.txt
      - name: Install CPU Torch and API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'numpy>=1.26,<3' 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' pytest httpx pyyaml
      - name: Compile existing verified v4 C++ baseline
        run: |
          cmake -S cpp_runtime/ae3d_v4 -B build/ae3d_v4 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ae3d_v4 --parallel 2
          ctest --test-dir build/ae3d_v4 --output-on-failure
      - name: Cross-runtime exact/quantized/HTTP tests
        env:
          JX_CPP_BIN: ${{ github.workspace }}/build/ae3d_v4/jxae3d
        run: |
          python -m pytest -o addopts='' -q cpp_runtime/ae3d_v4/cloud_accel/tests/test_accel.py
          python -m compileall -q cpp_runtime/ae3d_v4/cloud_accel
      - name: Benchmark and verify predicted-byte parity (no speed thresholds)
        run: |
          g++ -std=c++17 -O3 cpp_runtime/ae3d_v4/cloud_accel/bench_cpp_v4.cpp -o build/bench_cpp_v4
          build/ae3d_v4/jxae3d generate build/bench_input.jxvol 32 42
          build/ae3d_v4/jxae3d train build/bench_input.jxvol build/bench_model.jxmodel 10 0.004
          python cpp_runtime/ae3d_v4/cloud_accel/bench.py \
            --cpp build/ae3d_v4/jxae3d --cpp-kernel build/bench_cpp_v4 \
            --volume build/bench_input.jxvol --model build/bench_model.jxmodel \
            --threads 1 --repetitions 7 --out build/ae3d-v5-bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: ae3d-v5-cpu-parity-benchmark
          path: build/ae3d-v5-bench.json
