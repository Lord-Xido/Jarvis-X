name: Recursive 3D ANN integrity

on:
  pull_request:
    paths:
      - 'apps/recursive-3d-ann/**'
      - '.github/workflows/recursive-3d-ann.yml'
  workflow_dispatch:

jobs:
  reference-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install -r apps/recursive-3d-ann/requirements.txt
      - name: Verify embedded model and 1,000-stream round trip
        run: python -m pytest -q apps/recursive-3d-ann/test_runtime.py
