name: Deploy DMVX Matrix Live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dmvx-matrix-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: dmvx-matrix-live
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational runtime branch
        uses: actions/checkout@v6
        with:
          ref: agent/dmvx-1-transactional-firmware
      - name: Resolve operational source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run matrix runtime invariants
        id: invariants
        continue-on-error: true
        run: node --test apps/dmvx-matrix/test_core.mjs
      - name: Record preflight outcome on PR 70
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.invariants.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          cat > /tmp/dmvx-preflight.md <<EOF
          DMVX matrix live-release preflight:

          - operational source: \`${SOURCE_SHA}\`
          - six-test invariant suite: ${OUTCOME}
          - next stage: GitHub Pages deployment when preflight succeeds
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/70/comments" --raw-field body="$(cat /tmp/dmvx-preflight.md)"
      - name: Enforce preflight
        if: steps.invariants.outcome != 'success'
        run: exit 1

  deploy:
    needs: preflight
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational runtime branch
        uses: actions/checkout@v6
        with:
          ref: agent/dmvx-1-transactional-firmware
      - name: Resolve operational source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static runtime
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dmvx-matrix
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Record deployment outcome on PR 70
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          page_url="${PAGE_URL:-'(not produced)'}"
          cat > /tmp/dmvx-deploy.md <<EOF
          DMVX matrix runtime deployment receipt:

          - live URL: ${page_url}
          - operational source: \`${SOURCE_SHA}\`
          - invariant suite: passed in preflight
          - Pages configuration: ${CONFIGURE_OUTCOME}
          - artifact upload: ${UPLOAD_OUTCOME}
          - deployment: ${DEPLOY_OUTCOME}
          - release path: GitHub Pages artifact deployment from the default branch
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/70/comments" --raw-field body="$(cat /tmp/dmvx-deploy.md)"
      - name: Enforce deployment
        if: steps.configure.outcome != 'success' || steps.upload.outcome != 'success' || steps.deployment.outcome != 'success'
        run: exit 1
