name: Deploy DMVX Matrix Live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dmvx-matrix-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dmvx-matrix-live
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational runtime branch
        uses: actions/checkout@v6
        with:
          ref: agent/dmvx-1-transactional-firmware
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run matrix runtime invariants
        run: node --test apps/dmvx-matrix/test_core.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static runtime
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dmvx-matrix
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
