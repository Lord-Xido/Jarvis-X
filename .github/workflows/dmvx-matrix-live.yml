name: Deploy DMVX Matrix Live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dmvx-matrix-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: dmvx-matrix-live
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational runtime branch
        uses: actions/checkout@v6
        with:
          ref: agent/dmvx-1-transactional-firmware
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run matrix runtime invariants
        run: node --test apps/dmvx-matrix/test_core.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static runtime
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dmvx-matrix
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record live deployment on PR 70
        uses: actions/github-script@v8
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: f1ff17833b169851570883dc06b9b5b5df7206cc
        with:
          script: |
            const body = [
              'DMVX matrix runtime deployment receipt:',
              '',
              `- live URL: ${process.env.PAGE_URL}`,
              `- operational source head: \`${process.env.SOURCE_SHA}\``,
              '- invariant suite: passed before deployment',
              '- release path: GitHub Pages artifact deployment from the default branch',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body,
            });
