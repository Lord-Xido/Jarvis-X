name: Deploy DMVX Matrix Live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dmvx-matrix-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: dmvx-matrix-live
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational runtime branch
        uses: actions/checkout@v6
        with:
          ref: agent/dmvx-1-transactional-firmware
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run matrix runtime invariants
        run: node --test apps/dmvx-matrix/test_core.mjs
      - name: Record successful preflight on PR 70
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body: 'DMVX matrix live-release preflight passed: six invariant tests succeeded. GitHub Pages deployment is starting from operational source `f1ff17833b169851570883dc06b9b5b5df7206cc`.',
            });

  deploy:
    needs: preflight
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational runtime branch
        uses: actions/checkout@v6
        with:
          ref: agent/dmvx-1-transactional-firmware
      - name: Configure GitHub Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static runtime
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dmvx-matrix
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment outcome on PR 70
        if: always()
        uses: actions/github-script@v8
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: f1ff17833b169851570883dc06b9b5b5df7206cc
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const pageUrl = process.env.PAGE_URL || '(not produced)';
            const body = [
              'DMVX matrix runtime deployment receipt:',
              '',
              `- live URL: ${pageUrl}`,
              `- operational source head: \`${process.env.SOURCE_SHA}\``,
              '- invariant suite: passed in preflight',
              `- Pages configuration: ${process.env.CONFIGURE_OUTCOME}`,
              `- artifact upload: ${process.env.UPLOAD_OUTCOME}`,
              `- deployment: ${process.env.DEPLOY_OUTCOME}`,
              '- release path: GitHub Pages artifact deployment from the default branch',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body,
            });
