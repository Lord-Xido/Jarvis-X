name: Jarvis-X Runtime Pages

on:
  push:
    branches:
      - main
      - agent/dmvx-1-transactional-firmware
    paths:
      - "apps/dmvx-matrix/**"
      - "apps/permeation-transport/**"
      - ".github/workflows/dmvx-matrix-pages.yml"
  pull_request:
    paths:
      - "apps/dmvx-matrix/**"
      - "apps/permeation-transport/**"
      - ".github/workflows/dmvx-matrix-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: jarvis-x-runtime-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run matrix runtime invariants
        run: node --test apps/dmvx-matrix/test_core.mjs
      - name: Run permeation transport invariants
        run: node --test apps/permeation-transport/test_core.mjs
      - name: Smoke-check permeation browser entrypoint
        run: |
          grep -q "DM-vΩΞ⁺ PERMEATION TRANSPORT CORE" apps/permeation-transport/index.html
          grep -q "FixedStepEngine" apps/permeation-transport/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble shared static site
        run: |
          rm -rf dist
          mkdir -p dist/permeation-transport
          cp -a apps/dmvx-matrix/. dist/
          cp -a apps/permeation-transport/. dist/permeation-transport/
      - name: Upload static runtimes
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Enforce deployment result
        if: steps.configure.outcome != 'success' || steps.upload.outcome != 'success' || steps.deployment.outcome != 'success'
        run: exit 1

  report:
    if: always() && github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment outcome on PR 70
        uses: actions/github-script@v8
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const pageUrl = process.env.PAGE_URL || '(not produced)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body: [
                'Jarvis-X runtime Pages deployment outcome:',
                '',
                `- root runtime: ${pageUrl}`,
                `- permeation transport: ${pageUrl.replace(/\/$/, '')}/permeation-transport/`,
                `- deployed commit: \`${context.sha}\``,
                `- invariant test job: ${process.env.TEST_RESULT}`,
                `- Pages deployment job: ${process.env.DEPLOY_RESULT}`,
                '- release path: shared GitHub Pages artifact deployment',
              ].join('\n'),
            });
