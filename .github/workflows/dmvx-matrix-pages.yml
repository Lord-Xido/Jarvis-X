name: DMVX Matrix Runtime Pages

on:
  push:
    branches:
      - main
      - agent/dmvx-1-transactional-firmware
    paths:
      - "apps/dmvx-matrix/**"
      - ".github/workflows/dmvx-matrix-pages.yml"
  pull_request:
    paths:
      - "apps/dmvx-matrix/**"
      - ".github/workflows/dmvx-matrix-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: dmvx-matrix-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run matrix runtime invariants
        run: node --test apps/dmvx-matrix/test_core.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static runtime
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dmvx-matrix
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment receipt on PR 70
        uses: actions/github-script@v8
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body: [
                'DMVX matrix runtime deployed successfully.',
                '',
                `- live URL: ${process.env.PAGE_URL}`,
                `- deployed commit: \`${context.sha}\``,
                '- six runtime invariants passed before deployment',
                '- deployment: GitHub Pages artifact release',
              ].join('\n'),
            });
