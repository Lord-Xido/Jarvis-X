name: Exynos-Inspired 3D Bit Fabric

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/jarvisx/exynos3d_bit_fabric.py"
      - "tests/test_exynos3d_bit_fabric.py"
      - "docs/DR_MOAGI_EXYNOS3D_BIT_FABRIC.md"
      - ".github/workflows/exynos3d-bit-fabric.yml"
  push:
    branches: [main]
    paths:
      - "src/jarvisx/exynos3d_bit_fabric.py"
      - "tests/test_exynos3d_bit_fabric.py"
      - "docs/DR_MOAGI_EXYNOS3D_BIT_FABRIC.md"
      - ".github/workflows/exynos3d-bit-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile reference layer
        run: |
          python -m py_compile src/jarvisx/exynos3d_bit_fabric.py

      - name: Run focused bit-fabric tests
        run: |
          python -m pytest -q tests/test_exynos3d_bit_fabric.py
