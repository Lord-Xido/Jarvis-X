name: System Runtime Diagnostics

on:
  push:
    branches: [agent/finish-system-runtime]

permissions:
  contents: read

jobs:
  mypy-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture mypy output
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src/jarvisx --ignore-missing-imports 2>&1 | tee mypy-system-runtime.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-system-runtime
          path: mypy-system-runtime.log
          if-no-files-found: error
      - name: Preserve failure status
        if: steps.mypy.outcome == 'failure'
        run: exit 1
