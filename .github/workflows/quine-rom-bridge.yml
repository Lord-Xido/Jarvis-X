name: Quine ROM bridge conformance
on:
  push:
    paths:
      - 'src/jarvisx/quine_rom_bridge.py'
      - 'src/jarvisx/dm3d_rom.py'
      - 'tests/test_quine_rom_bridge.py'
      - '.github/workflows/quine-rom-bridge.yml'
  pull_request:
    paths:
      - 'src/jarvisx/quine_rom_bridge.py'
      - 'src/jarvisx/dm3d_rom.py'
      - 'tests/test_quine_rom_bridge.py'
      - '.github/workflows/quine-rom-bridge.yml'
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests and package
        run: python -m pip install -e '.[test]'
      - name: Exact round-trip and corruption gates
        run: python -m pytest -q -o addopts='' tests/test_quine_rom_bridge.py
