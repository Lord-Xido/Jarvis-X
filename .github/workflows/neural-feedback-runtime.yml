name: Neural Feedback Runtime

on:
  push:
    paths:
      - "src/jarvisx/neural_feedback_runtime.py"
      - "src/jarvisx/neural_feedback_cli.py"
      - "tests/test_neural_feedback_runtime.py"
      - "docs/NEURAL_FEEDBACK_RUNTIME.md"
      - ".github/workflows/neural-feedback-runtime.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/jarvisx/neural_feedback_runtime.py"
      - "src/jarvisx/neural_feedback_cli.py"
      - "tests/test_neural_feedback_runtime.py"
      - "docs/NEURAL_FEEDBACK_RUNTIME.md"
      - ".github/workflows/neural-feedback-runtime.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Targeted tests
        run: python -m pytest tests/test_neural_feedback_runtime.py -q
      - name: Operational smoke cycle
        run: >-
          python -m jarvisx.neural_feedback_cli
          --cycles 3
          --input-dim 32
          --latent-dim 8
          --verification-threshold 0.40
          --checkpoint neural-feedback-smoke.npz
      - name: Verify checkpoint
        run: test -s neural-feedback-smoke.npz
